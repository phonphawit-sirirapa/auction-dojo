  const o=S.bars[k*per].o,c=S.bars[n-1].c,P=prof(S,n),IB=prof(S,S.ibn),p=S.prior;let singles=0;P.tp.forEach(t=>{if(t.length===1&&t[0]===k)singles++});
  const dir=Math.sign(c-o),mid=(h+l)/2,ir=dir>0?(mid>=p.val?'ib':'rb'):dir<0?(mid<=p.vah?'is':'rs'):null,ibP=Math.ceil(S.ibn/per);
  return{k,h,l,o,c,prevH,prevL,newHi:k>0&&h>prevH,newLo:k>0&&l<prevL,outUp:k>=ibP&&c>IB.ibh,outDn:k>=ibP&&c<IB.ibl,singles,dir,ir,ibh:IB.ibh,ibl:IB.ibl,ibP}}
function nextOutcome(f){return f.newHi&&!f.newLo?'up':f.newLo&&!f.newHi?'dn':!f.newHi&&!f.newLo?'in':'both'}
// what the principles favour for the next period, with the reason
function ltLean(S,k){const f=perFacts(S,k),g=k>0?perFacts(S,k-1):null;
  if(g&&((f.outUp&&g.outUp)||(f.outDn&&g.outDn)))return{pick:f.outUp?'up':'dn',why:`${LET[k-1]} และ ${LET[k]} ปิดนอก IB ${f.outUp?'บน':'ล่าง'} 2 ช่วงติด = acceptance ตลาดมีแนวโน้มขยายต่อไปทางนั้น`};
  if(f.singles>=3&&f.dir)return{pick:f.dir>0?'up':'dn',why:`${LET[k]} ทิ้ง single prints ${f.singles} แถว = มีคนลงมือแรง (initiative) มักมีแรงต่อ`};
  if(k>0&&((f.newHi&&f.c<f.prevH)||(f.newLo&&f.c>f.prevL)))return{pick:'in',why:`${LET[k]} ทำ ${f.newHi?'high':'low'} ใหม่แต่ปิดกลับเข้ากรอบเดิม = ราคาใหม่ถูกปฏิเสธ มักหมุนกลับเข้ากรอบ`};
  return{pick:'in',why:'ยังไม่เห็น acceptance หรือ initiative ที่ชัด ตลาดใช้เวลาส่วนใหญ่หมุนอยู่ในกรอบ'}}
function ltNarrate(S,k){const f=perFacts(S,k),a=[`<b>${LET[k]}</b> <span class="mono">${ltTime(S,k)}</span> ช่วง ${f1(f.l)}–${f1(f.h)}`];
  a.push(f.newHi&&f.newLo?'ทำทั้ง high และ low ใหม่':f.newHi?'ทำ high ใหม่ของวัน':f.newLo?'ทำ low ใหม่ของวัน':k?'อยู่ในกรอบเดิม':'ช่วงแรกของวัน');
  if(f.outUp)a.push('ปิดเหนือ IB');if(f.outDn)a.push('ปิดใต้ IB');if(f.singles>=2)a.push(`ทิ้ง single prints ${f.singles} แถว`);if(f.ir)a.push(IRN[f.ir]);return a.join(' · ')}
// a question about the period that just finished (read from its letters)
function ltQuestion(S,k,R){const f=perFacts(S,k),g=k>0?perFacts(S,k-1):null,L=LET[k];
  if(g&&(g.outUp||g.outDn)&&k>=f.ibP+1){const side=g.outUp?'บน':'ล่าง',acc=(g.outUp&&f.outUp)||(g.outDn&&f.outDn);
    return{q:`${LET[k-1]} ปิดนอก IB ${side} แล้ว ${L} เป็นอย่างไร?`,opts:['ปิดนอก IB ฝั่งเดิมอีกช่วง = acceptance','กลับเข้ามาใน IB = ถูกปฏิเสธ'],a:acc?0:1,ex:acc?'สองช่วงติดกันนอก IB คือหลักฐานว่าตลาดยอมรับราคาใหม่':'ราคานอก IB อยู่ได้ไม่ถึง 2 ช่วง แปลว่าไม่มีคนต้องการราคานั้น'}}
  if(k>0&&(f.newHi||f.newLo)&&R()<.6)return{q:`ช่วง ${L} ทำอะไรกับกรอบของวัน?`,opts:['ทำ high ใหม่','ทำ low ใหม่','ทำทั้ง high และ low ใหม่','อยู่ในกรอบเดิม'],a:f.newHi&&f.newLo?2:f.newHi?0:1,ex:`กรอบก่อน ${L}: ${f1(f.prevL)}–${f1(f.prevH)} · ${L}: ${f1(f.l)}–${f1(f.h)}`};
  if(f.singles>=3)return{q:`ช่วง ${L} ทิ้งแถวที่มีตัวอักษรเดียวไว้กี่แถว (single prints ของ ${L})?`,opts:shuffle([f.singles,f.singles+2,Math.max(1,f.singles-2),f.singles+4].map(String)).filter((x,i,a)=>a.indexOf(x)===i),aText:String(f.singles),ex:`นับแถวที่มีแค่ตัว ${L} ตัวเดียว ช่วงที่ทิ้ง single prints ยาวคือช่วงที่มีคนลงมือแรง`};
  if(f.ir)return{q:`เทียบกับ value area เมื่อวาน (pVAH/pVAL) ช่วง ${L} เป็นการซื้อขายแบบไหน?`,opts:Object.values(IRN),a:Object.keys(IRN).indexOf(f.ir),ex:`${L} ${f.dir>0?'ปิดสูงกว่าเปิด':'ปิดต่ำกว่าเปิด'} และอยู่${(f.h+f.l)/2>S.prior.vah?'เหนือ':(f.h+f.l)/2<S.prior.val?'ใต้':'ใน'} VA เมื่อวาน → ${IRN[f.ir]}`};
  if(k>0)return{q:`ช่วง ${L} ทำอะไรกับกรอบของวัน?`,opts:['ทำ high ใหม่','ทำ low ใหม่','ทำทั้ง high และ low ใหม่','อยู่ในกรอบเดิม'],a:f.newHi&&f.newLo?2:f.newHi?0:f.newLo?1:3,ex:`กรอบก่อน ${L}: ${f1(f.prevL)}–${f1(f.prevH)} · ${L}: ${f1(f.l)}–${f1(f.h)}`};
  return null}
function ltNew(){const src=LT&&LT.src||'sim',R=Math.random;let S=null;
  if(src!=='sim'&&HAS_REAL){for(let t=0;t<20&&!S;t++){const k=1+Math.floor(R()*(REAL.sessions.length-1));S=src==='ny'?nySession(k):realSession(k)}}
  if(!S)S=makeSession(pick(R,['normal','normalVar','trend','neutral','double','OD','ORR','eighty','failBO']),(R()*1e9)>>>0,{d:R()<.5?1:-1});
  const np=Math.ceil(S.nb/S.per),ibP=Math.ceil(S.ibn/S.per);
  LT={src:S.src==='gc'?src:'sim',S,np,p:ibP,ibP,log:[],sc:{q:0,qn:0,lean:0,hit:0,pn:0},ans:{},end:null};
  for(let k=0;k<ibP;k++)LT.log.push(ltNarrate(S,k));LT.cur=ltQuestion(S,LT.p-1,R)}
function renderLetters(){if(!LT)ltNew();const T=LT,S=T.S,done=T.p>=T.np;
  const srcBtn=(k,l)=>`<button role="radio" aria-checked="${T.src===k}" data-src="${k}" ${k!=='sim'&&!HAS_REAL?'disabled':''}>${l}</button>`;
  V.innerHTML=`<section class="wrap arena"><div class="ahead"><div><p class="eyebrow">ฝึกอ่านตัวอักษร TPO</p><h1>${S.src==='gc'?`ทองจริง${S.ny?' · ช่วงนิวยอร์ก':' · ทั้งวัน 23 ชม.'}`:'วันจำลอง'}</h1></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button class="btn" id="ltNew">วันใหม่</button><button class="link" id="ltBack">← เส้นทาง</button></div></div>

      if(ST.onInv&&!done.oni&&seg&&seg[i]==='ny'&&seg[i-1]!=='ny'&&S.settle!=null){let ab=0,nn=0;for(let q=0;q<i;q++){nn++;if(S.bars[q].c>S.settle)ab++}
        const fr0=ab/nn,inv=fr0>=.65?1:fr0<=.35?-1:0;done.oni=1;
        if(inv&&(b.c-b.o)*inv<0){const sd=-inv,stop=(sd<0?b.h:b.l)-sd*.1*u,dist=(b.c-stop)*sd,tg=(S.settle-b.c)*sd>=dist?S.settle:b.c+1.5*(b.c-stop);
          tryOpen(i,sd,stop,tg,'onInv',`overnight inventory ${inv>0?'long':'short'} (${Math.round(fr0*100)}% ปิดเหนือ settle) แท่งแรกของนิวยอร์กเริ่มปรับ inventory → ${sd>0?'Long':'Short'} ตามการปรับ`)}}
    }
    // --- sub-session rules (tested in tools/backtest.js; off unless enabled) ---
    if(seg){const sg=seg[i],pc=i>0?S.bars[i-1].c:b.o;
      if(sg==='asia'){
        // fade the first touch of yesterday's London AVWAP / London IB during Asia
        if(ST.yLfade&&SS.yav.london){const yi=SS.yib.london||{};for(const[kk,L,nm]of[['vw',SS.yav.london[i],'AVWAP ลอนดอนเมื่อวาน'],['ibh',yi.h,'IB High ลอนดอนเมื่อวาน'],['ibl',yi.l,'IB Low ลอนดอนเมื่อวาน']]){
          if(L==null||done['yl'+kk]||!(b.l<=L&&b.h>=L))continue;done['yl'+kk]=1;const sd=pc>L?1:-1;
          if((b.c-L)*sd>=.1*u){const stop=(sd>0?b.l:b.h)-sd*.2*u;tryOpen(i,sd,stop,b.c+1.5*(b.c-stop),'yLfade',`ช่วงเอเชียราคาแตะ ${nm} ครั้งแรกแล้วปิดกลับฝั่งเดิม = ถูกปฏิเสธ fade เป้า 1.5R`,true)}}}
        // idea B: Asia opens at/beyond yesterday's NY VWAP ±2SD, first close outside the Asia IB back toward that VWAP
        if(ST.asiaBand&&!done.ab&&SS.yny&&SS.yny.sd>0&&SS.ib.asia&&i>SS.ib.asia.i1){const ai=SS.ib.asia,V0=SS.yny.v,z=(S.bars[SS.start.asia].o-V0)/SS.yny.sd,dir=b.c>ai.h?1:b.c<ai.l?-1:0;
          if(dir){done.ab=1;if(Math.abs(z)>=2&&dir===-Math.sign(z)){const stop=cfg.asiaBandStop==='mid'?(ai.h+ai.l)/2:dir>0?ai.l:ai.h;
            if(tryOpen(i,dir,stop,V0,'asiaBand',`ช่วงเอเชียเปิด${z>0?'เหนือ':'ใต้'} VWAP นิวยอร์กเมื่อวาน ${Math.abs(z).toFixed(1)} SD (เลย ±2SD) แล้วปิดทะลุ IB เอเชียกลับไปทาง VWAP เป้า = VWAP นิวยอร์ก ปิดเมื่อจบช่วงเอเชีย`,true,true))pos.asiaOnly=true}}}
        // drift toward yesterday's New York AVWAP after the Asia IB breaks in that direction
        if(ST.nyMagnet&&!done.nym&&SS.yav.ny&&SS.ib.asia&&i>SS.ib.asia.i1){const ai=SS.ib.asia,T0=SS.yav.ny[i],dir=Math.sign(T0-b.c);
          if(Math.abs(T0-b.c)>=.8*u&&(dir>0?b.c>ai.h&&pc<=ai.h:b.c<ai.l&&pc>=ai.l)){done.nym=1;const edge=dir>0?ai.h:ai.l;
            tryOpen(i,dir,edge-dir*.4*u,T0,'nyMagnet',`ราคาทะลุ IB เอเชียไปทาง AVWAP นิวยอร์กเมื่อวาน (ห่าง ${f1(Math.abs(T0-b.c))}) ซึ่งมักถูกกลับมาแตะ เป้า = AVWAP นั้น`,true)}}}

      // New York session, referenced to today's Asia session
      if(sg==='ny'&&SS.start.asia>=0&&ah>al){const ni=SS.ib.ny,AA=SS.av.asia[i],ibDone=ni&&i>ni.i1,ai=SS.ib.asia||{};
        // drift toward today's Asia AVWAP after the NY IB breaks in that direction
        if(ST.asMagnet&&ibDone&&!done.asm){const dir=Math.sign(AA-b.c);
          if(Math.abs(AA-b.c)>=.8*u&&(dir>0?b.c>ni.h&&pc<=ni.h:b.c<ni.l&&pc>=ni.l)){done.asm=1;const edge=dir>0?ni.h:ni.l;
            tryOpen(i,dir,edge-dir*.4*u,AA,'asMagnet',`ราคาทะลุ IB นิวยอร์กไปทาง AVWAP เอเชียของวันนี้ (ห่าง ${f1(Math.abs(AA-b.c))}) เป้า = AVWAP นั้น`)}}
        // NY IB look-above/below-and-fail on the side away from Asia AVWAP: trade back toward it
        if(ST.asFail&&ibDone&&!done.asf&&perEnd0(i))for(const sd of[-1,1]){const edge=sd<0?ni.h:ni.l;if((AA-b.c)*sd<=0)continue;let x2=sd<0?-1e9:1e9;
          for(let j=Math.max(ni.i1+1,i-per+1);j<=i;j++)x2=sd<0?Math.max(x2,S.bars[j].h):Math.min(x2,S.bars[j].l);
          if(sd<0?x2>edge+.15*u&&b.c<edge:x2<edge-.15*u&&b.c>edge){done.asf=1;tryOpen(i,sd,x2+(sd<0?.2:-.2)*u,AA,'asFail',`ทะลุ IB นิวยอร์กฝั่งที่ห่างจาก AVWAP เอเชียแล้วล้มเหลว กลับเข้ากรอบ เป้า = AVWAP เอเชีย`);break}}
        // fade the first NY touch of the Asia high/low or Asia IB
        if(ST.asFade)for(const[kk,L,nm]of[['ah',ah,'high ของช่วงเอเชีย'],['al',al,'low ของช่วงเอเชีย'],['aih',ai.h,'IB High เอเชีย'],['ail',ai.l,'IB Low เอเชีย']]){
          if(L==null||done['af'+kk]||!(b.l<=L&&b.h>=L))continue;done['af'+kk]=1;const sd=pc>L?1:-1;
          if((b.c-L)*sd>=.1*u){const stop=(sd>0?b.l:b.h)-sd*.2*u;tryOpen(i,sd,stop,b.c+1.5*(b.c-stop),'asFade',`ช่วงนิวยอร์กแตะ ${nm} ครั้งแรกแล้วปิดกลับฝั่งเดิม = ถูกปฏิเสธ fade เป้า 1.5R`)}}
        // close outside the Asia range for one TPO period during NY: go with it at once
        if(ST.asBOnow)for(const sd of[1,-1]){const edge=sd>0?ah:al,k='abn'+sd;if(done[k])continue;let nO=0;for(let j=Math.max(SS.start.ny,i-per+1);j<=i;j++)if((S.bars[j].c-edge)*sd>0)nO++;
          if(perEnd0(i)&&nO>=per&&(S.vw[i]-(ah+al)/2)*sd>0){const stop=edge-sd*.5*u;done[k]=tryOpen(i,sd,stop,b.c+2*(b.c-stop),'asBOnow',`ช่วงนิวยอร์กปิดนอกกรอบเอเชียครบ 1 ช่วง TPO ตามทิศทันที เป้า 2R`)}}
        // acceptance outside the Asia range during NY, then the retest
        if(ST.asBO)for(const sd of[1,-1]){const edge=sd>0?ah:al,k='abo'+sd;if(done[k])continue;
          aout[sd]=(b.c-edge)*sd>0?aout[sd]+1:0;if(aout[sd]>=per&&(S.vw[i]-(ah+al)/2)*sd>0)armed[k]=armed[k]||i;if(armed[k]&&(b.c-edge)*sd<0)armed[k]=0;
          if(armed[k]&&i>armed[k]&&(sd>0?b.l<=edge+.25*u:b.h>=edge-.25*u)&&(b.c-edge)*sd>.05*u){const stop=edge-sd*.5*u;
            done[k]=tryOpen(i,sd,stop,b.c+2*(b.c-stop),'asBO',`ช่วงนิวยอร์กปิดนอกกรอบเอเชีย (${sd>0?'เหนือ high':'ใต้ low'}) ครบ 1 ช่วง TPO แล้วย่อมาทดสอบขอบกรอบและยืนได้ เป้า 2R`)}}}
      if(sg==='london'&&SS.ib.london&&i>SS.ib.london.i1){const li=SS.ib.london,AV=SS.av.london,lmid=(li.h+li.l)/2;
        // London IB acceptance + retest, London AVWAP on the same side
        if(ST.lonBO)for(const sd of[1,-1]){const edge=sd>0?li.h:li.l,k='lbo'+sd;if(done[k])continue;
          lout[sd]=(b.c-edge)*sd>0?lout[sd]+1:0;if(lout[sd]>=per&&(AV[i]-lmid)*sd>0)armed[k]=armed[k]||i;if(armed[k]&&lout[sd]===0&&(b.c-edge)*sd<0)armed[k]=0;
          if(armed[k]&&i>armed[k]&&(sd>0?b.l<=edge+.25*u:b.h>=edge-.25*u)&&(b.c-edge)*sd>.05*u){const stop=edge-sd*.5*u;
            done[k]=tryOpen(i,sd,stop,b.c+2*(b.c-stop),'lonBO',`ปิดนอก IB ลอนดอน ${sd>0?'High':'Low'} ครบ 1 ช่วง TPO AVWAP ลอนดอนอยู่ฝั่งเดียวกัน แล้วย่อกลับมาทดสอบขอบและยืนได้ เป้า 2R`)}}
        // pullback to London AVWAP when it has a clear slope
        if(ST.lonVwap&&!done.lvw){const lk=Math.round(60/S.mins);if(i-lk>=SS.start.london){const slp=AV[i]-AV[i-lk],sd=Math.sign(slp);
          if(Math.abs(slp)>=.3*u){let ok=true;for(let j=i-lk;j<i;j++)if((S.bars[j].c-AV[j])*sd<=0){ok=false;break}
            if(ok&&(sd>0?b.l<=AV[i]+.1*u:b.h>=AV[i]-.1*u)&&(b.c-AV[i])*sd>0){const stop=sd>0?Math.min(b.l,AV[i]-.3*u)-.15*u:Math.max(b.h,AV[i]+.3*u)+.15*u;
              done.lvw=tryOpen(i,sd,stop,b.c+2*(b.c-stop),'lonVwap',`AVWAP ลอนดอนชัน${sd>0?'ขึ้น':'ลง'} ราคาอยู่ฝั่งเดียวมา 1 ชม. แล้วย่อมาแตะและปิดกลับ เป้า 2R`)}}}}}
    }
    if(i<i0)continue;
    const k0=i-i0,perEnd=k0%per===per-1,pl=LET[Math.floor(i/per)];
    // 80% rule
    if(ST.eighty&&openOut&&!done.eighty&&perEnd){vaRun=inVA(b.c)?vaRun+1:0;if(vaRun>=2){const sd=-openOut;let xo=sd>0?1e9:-1e9;for(let j=i0;j<=i;j++)xo=sd>0?Math.min(xo,S.bars[j].l):Math.max(xo,S.bars[j].h);const st=sd>0?Math.min(xo-.15*u,p.val-.5*u):Math.max(xo+.15*u,p.vah+.5*u);done.eighty=tryOpen(i,sd,st,sd>0?p.vah:p.val,'eighty',`เปิด${openOut>0?'เหนือ':'ใต้'} VA เมื่อวาน แล้วปิดใน VA ครบ 2 ช่วง TPO (ถึงช่วง ${pl}) = 80% rule ไปหา${sd>0?' pVAH':' pVAL'} stop ${sd>0?'ใต้ low':'เหนือ high'}ของวันที่อยู่นอก VA`)||!!pos}}
    // VA edge fade when the day opened inside value
    if(ST.vaFade&&!openOut&&i>i0)for(const sd of[-1,1]){const k='fade'+sd;if(done[k])continue;const edge=sd<0?p.vah:p.val;let x2=sd<0?-1e9:1e9;
      for(let j=Math.max(i0,i-per);j<i;j++)x2=sd<0?Math.max(x2,S.bars[j].h):Math.min(x2,S.bars[j].l);
      const beyond=sd<0?x2-edge:edge-x2,pc=S.bars[i-1].c,back=sd<0?b.c<edge-.1*u&&pc>=edge-.1*u:b.c>edge+.1*u&&pc<=edge+.1*u;
      if(beyond>=.2*u&&beyond<=.9*u&&back){done[k]=1;tryOpen(i,sd,x2+(sd<0?.2:-.2)*u,p.poc,'vaFade',`เปิดใน VA ราคาไปทดสอบ${sd<0?'เหนือ pVAH':'ใต้ pVAL'} แล้วปิดกลับเข้า VA = ถูกปฏิเสธ fade กลับหา pPOC`)}}
    if(i<=ibEnd){ibh=Math.max(ibh,b.h);ibl=Math.min(ibl,b.l);continue}
    const mid=(ibh+ibl)/2,ibName=useR?'IB ช่วงสหรัฐฯ':'IB';
    // look above/below IB and fail (judged at the end of each TPO period)
    if(ST.fail&&perEnd)for(const sd of[-1,1]){const k='fail'+sd;if(done[k]||ext[-sd]>=2)continue;const edge=sd<0?ibh:ibl;let x2=sd<0?-1e9:1e9;
      for(let j=i-per+1;j<=i;j++)x2=sd<0?Math.max(x2,S.bars[j].h):Math.min(x2,S.bars[j].l);
      if((sd<0?x2>edge+.15*u&&b.c<edge:x2<edge-.15*u&&b.c>edge)){done[k]=1;tryOpen(i,sd,x2+(sd<0?.2:-.2)*u,mid,'fail',`ทะลุ ${ibName} ${sd<0?'High':'Low'} ในช่วง ${pl} แต่ปิดช่วงกลับเข้ากรอบ = look ${sd<0?'above':'below'} and fail เป้ากลาง IB`)}}
    // acceptance outside IB, then buy/sell the retest of the IB edge
    if(ST.accept)for(const sd of[1,-1]){const edge=sd>0?ibh:ibl,k='acc'+sd;
      if(perEnd){ext[sd]=(b.c-edge)*sd>0?ext[sd]+1:0;if(ext[sd]>=2&&!armed[k]&&!done[k])armed[k]=i;if(armed[k]&&ext[sd]===0)armed[k]=0}
      if(armed[k]&&!done[k]&&i>armed[k]&&(sd>0?b.l<=edge+.25*u:b.h>=edge-.25*u)&&(b.c-edge)*sd>.05*u&&(VW[i]-mid)*sd>0&&(prof(S,i+1).poc-mid)*sd>0){const stop=edge-sd*.5*u;
        done[k]=tryOpen(i,sd,stop,b.c+cfg.tgtR*(b.c-stop),'accept',`ปิดนอก ${ibName} ${sd>0?'High':'Low'} 2 ช่วง TPO ติด (acceptance) VWAP และ POC ย้ายตามมาฝั่งเดียวกัน แล้วย่อกลับมาทดสอบขอบ IB และยืนได้ เป้า ${cfg.tgtR}R`)}}
    // VWAP pullback when VWAP has a clear slope
    if(ST.vwap&&!pos&&vwN<2&&i>=ibEnd+per){const lk=Math.min(i-i0,Math.round(60/S.mins)),slp=VW[i]-VW[i-lk],sd=Math.sign(slp);
      if(lk>0&&Math.abs(slp)>=cfg.vwSlope*u){let side=true;for(let j=i-lk;j<i;j++)if((S.bars[j].c-VW[j])*sd<=0){side=false;break}
        if(side&&(sd>0?b.l<=VW[i]+.1*u:b.h>=VW[i]-.1*u)&&(b.c-VW[i])*sd>0){const stop=sd>0?Math.min(b.l,VW[i]-.5*SD[i])-.15*u:Math.max(b.h,VW[i]+.5*SD[i])+.15*u;
          if(tryOpen(i,sd,stop,b.c+cfg.tgtR*(b.c-stop),'vwap',`VWAP${useR&&cfg.rthVwap?' (เริ่มนับตอนตลาดสหรัฐฯ เปิด)':''} ชัน${sd>0?'ขึ้น':'ลง'} ราคาอยู่${sd>0?'เหนือ':'ใต้'} VWAP มาตลอด 1 ชม. แล้วย่อมาแตะ VWAP และปิดกลับฝั่งเดิม เป้า ${cfg.tgtR}R`))vwN++}}}
  }
  return T}

/* --- coach: context alerts --- */
function alerts(i){const S=A.S,u=S.U;
  if(i===S.ibn-1&&DF.ctx){const P=prof(S,S.ibn),ib=P.ibh-P.ibl;const nar=S.ibMed?ib<.75*S.ibMed:ib<1.1*u,wid=S.ibMed?ib>1.3*S.ibMed:ib>1.8*u;
    say('info',`IB ก่อตัวแล้ว ${f1(ib)} จุด${S.ibMed?` (ค่ากลาง 10 วันก่อน ${f1(S.ibMed)})`:''}: ${nar?'แคบ ระวังการขยายกรอบหรือวันเทรนด์':wid?'กว้าง มีแนวโน้มเป็นวัน balance':'ปานกลาง'}`)}
  // range extension: judge acceptance one TPO period at a time
  if(DF.ctx&&i>=S.ibn){const IBP=prof(S,S.ibn),b=S.bars[i],F=A.flags;
    if(!F.extSeen&&(b.h>IBP.ibh||b.l<IBP.ibl)){F.extSeen=true;say('info',`ราคาออกนอก IB ${b.h>IBP.ibh?'High':'Low'} แล้ว อย่าเพิ่งไล่ ดูว่าจะปิดช่วง TPO นี้นอก IB ได้ไหม`)}
    if(i%S.per===S.per-1){const per=LET[Math.floor(i/S.per)],P=prof(S,i+1);
      for(const[dir,edge,lab]of[[1,IBP.ibh,'High'],[-1,IBP.ibl,'Low']]){const key='ext'+dir,out=(b.c-edge)*dir>0;let nOut=0;
        for(let j=Math.max(S.ibn,i-S.per+1);j<=i;j++)if((S.bars[j].c-edge)*dir>0)nOut++;
        if(out&&nOut>=Math.ceil(S.per*.66)){F[key]=(F[key]||0)+1;
          if(F[key]===1)say('info',`ช่วง ${per} ปิดนอก IB ${lab} ได้ 1 ช่วง ยังไม่ใช่ acceptance รอช่วงถัดไป และดูว่า POC (${P.poc}) ย้ายตามออกไปหรือไม่`);
          else if(F[key]===2){const mig=(P.poc-edge)*dir>=0,vw=(S.vw[i]-edge)*dir>-.3*S.U;say('warn',`Acceptance นอก IB ${lab}: ปิดนอก IB 2 ช่วง TPO ติดกัน${mig?' และ POC ย้ายตามออกไปแล้ว':''}${vw?' VWAP ตามมาใกล้ขอบ IB':''} การ fade กลับเข้ากรอบเสี่ยงขึ้นมาก ถ้าจะตามให้รอย่อมาทดสอบขอบ IB`)}}
        else if(F[key]>=1&&!out){if(F[key]===1)say('warn',`IB ${lab} ขยายหลอก: อยู่นอกกรอบได้แค่ 1 ช่วง TPO แล้วปิดกลับเข้า IB ในช่วง ${per} = rejection (look ${dir>0?'above':'below'} and fail)`);else say('bad',`ราคาปิดกลับเข้า IB หลังมี acceptance นอก ${lab} ระวัง: breakout ที่ถูกยอมรับแล้วกลับเข้ากรอบ มักวิ่งไปอีกฝั่งของ IB`);F[key]=0}}}}
  // news-style spike
  if(DF.realism&&i>=4){const b=S.bars[i];let rg=0;for(let j=i-4;j<i;j++)rg+=S.bars[j].h-S.bars[j].l;rg/=4;
    if(b.h-b.l>Math.max(2.6*rg,.9*S.U)&&!(A.flags.spk>=i-3)){A.flags.spk=i;say('warn',`Spike: แท่งนี้กว้าง ${f1(b.h-b.l)} จุด (${((b.h-b.l)/rg).toFixed(1)} เท่าของปกติ) อย่าไล่ราคา รอดูว่าราคาจะยืนได้หรือดีดกลับ${A.pos?' · ตรวจ stop ของคุณ':''}`)}}
  if(DF.alert&&S.q&&A.n===S.q&&ALERT[S.kind]){say('warn','จับตา: '+ALERT[S.kind]);halt()}
}
/* --- coach: notes at entry --- */
function tagNotes(tag,sg,px,i){const S=A.S,p=S.prior,u=S.U,P=prof(S,i+1),n=[];
  switch(tag){
   case'eighty':{const out=S.open>p.vah||S.open<p.val;if(!out)n.push('80% rule ใช้เมื่อเปิดนอก VA เมื่อวาน แต่วันนี้เปิดใน VA');else{if(!(px<p.vah&&px>p.val))n.push('ราคายังไม่กลับเข้ามาใน VA เมื่อวาน');if(!((S.open<p.val&&sg>0)||(S.open>p.vah&&sg<0)))n.push('ทิศผิด: 80% rule เทรดไปหาขอบ VA อีกฝั่ง');if(i<S.ibn+S.per-1)n.push('ยังไม่ครบ 2 ช่วง TPO ใน VA (เข้าเร็วเกินไป)')}break}
   case'vaFade':{const nt=Math.abs(px-p.vah)<=.5*u||Math.abs(px-P.vah)<=.4*u,nb=Math.abs(px-p.val)<=.5*u||Math.abs(px-P.val)<=.4*u;if(sg<0&&!nt)n.push('Fade ขอบ VA: short ควรเข้าใกล้ VAH');if(sg>0&&!nb)n.push('Fade ขอบ VA: long ควรเข้าใกล้ VAL');break}
   case'vwap':{const sl=S.vw[i]-S.vw[Math.max(0,i-6)];if(sl*sg<=0)n.push('VWAP ไม่ได้ชันไปทางที่เทรด pullback setup ใช้ในวันที่มีทิศทาง');if(Math.abs(px-S.vw[i])>Math.max(1.2*S.sd[i],.6*u))n.push('เข้าไกลจาก VWAP เกินไป (ไล่ราคา)');break}
   case'accept':{if(i<S.ibn-1)n.push('IB ยังไม่ก่อตัวครบ');else if(!(sg>0?px>P.ibh:px<P.ibl))n.push('ราคายังไม่ออกนอก IB ไปทางที่เทรด');else if(i<S.ibn+S.per-1)n.push('ออกนอก IB ยังไม่ถึง 2 ช่วง TPO ยังไม่ใช่ acceptance');break}
   case'fail':{if(i<S.ibn-1)n.push('IB ยังไม่ก่อตัวครบ');else if(sg<0?px>P.ibh:px<P.ibl)n.push('ราคายังอยู่นอก IB ยังไม่ได้กลับเข้ากรอบ');break}
   case'single':{if(!P.singles.some(s=>!s.top&&!s.bot&&Math.min(Math.abs(px-s.a),Math.abs(px-s.b))<=.4*u))n.push('ไม่มีโซน single prints ใกล้ราคาที่เข้า');break}
  }
  return n}
function riskNotes(t){const u=A.S.U,n=[];
  if(t.dist<.15*u)n.push('Stop แคบมาก อยู่ในระยะ noise ปกติ');if(t.dist>2.2*u)n.push('Stop กว้างมาก ขนาดสัญญาจะเล็กและ R:R ทำได้ยาก');
  if(t.target!=null){const rr=Math.abs(t.target-t.entry)/t.dist;if(rr<1)n.push(`R:R ${rr.toFixed(1)} ต่ำกว่า 1`)}
  if(t.riskPct>2.05)n.push(`ความเสี่ยงจริง ${t.riskPct.toFixed(1)}% เกินกฎ 2%`);return n}
/* --- coach: what invalidates each setup while in a trade --- */
function refOf(t){const S=A.S,p=S.prior,i=t.i,P=prof(S,i+1),sg=t.side;
  switch(t.tag){
   case'vaFade':{const c=sg<0?[p.vah,P.vah]:[p.val,P.val];return c.reduce((a,b)=>Math.abs(b-t.entry)<Math.abs(a-t.entry)?b:a)}
   case'fail':return i>=S.ibn-1?(sg<0?P.ibh:P.ibl):null;
   case'accept':return i>=S.ibn-1?(sg>0?P.ibh:P.ibl):null;
   case'single':{const rs=P.singles.filter(s=>!s.top&&!s.bot&&(sg>0?s.a<=t.entry+1:s.b>=t.entry-1));if(!rs.length)return null;const r=rs.reduce((a,b)=>Math.abs((b.a+b.b)/2-t.entry)<Math.abs((a.a+a.b)/2-t.entry)?b:a);return(r.a+r.b)/2}
  }return null}
function watch(t,i){if(t.invalidAt!=null)return;const S=A.S,b=S.bars[i],pb=S.bars[i-1],sg=t.side;let txt=null;
  const ag=(x,ref)=>sg>0?x<ref:x>ref, two=i-1>t.i;
  switch(t.tag){
   case'eighty':{const p=S.prior;if(ag(b.c,sg>0?p.val:p.vah))txt=`ราคาปิดกลับออกนอก VA เมื่อวาน (${sg>0?'ใต้ pVAL':'เหนือ pVAH'}) เหตุผลของ 80% rule หายไปแล้ว`;break}
   case'vaFade':if(t.ref!=null&&two&&ag(b.c,t.ref)&&ag(pb.c,t.ref))txt='ราคาปิดนอกขอบ VA 2 แท่งติด เริ่มมี acceptance ที่ราคาใหม่ การ fade ไม่มีเหตุผลแล้ว';break;
   case'fail':if(t.ref!=null&&two&&ag(b.c,t.ref)&&ag(pb.c,t.ref))txt='ราคากลับไปยืนนอก IB ได้ 2 แท่ง การ “fail” ไม่จริงแล้ว';break;
   case'vwap':if(two&&ag(b.c,S.vw[i])&&ag(pb.c,S.vw[i-1]))txt=`ราคาปิด${sg>0?'ใต้':'เหนือ'} VWAP 2 แท่งติด ${sg>0?'ผู้ซื้อ':'ผู้ขาย'}เสียการควบคุม`;break;
   case'accept':if(t.ref!=null&&ag(b.c,t.ref))txt='ราคาปิดกลับเข้ามาใน IB breakout ไม่ได้รับการยอมรับแล้ว';break;
   case'single':if(t.ref!=null&&ag(b.c,t.ref))txt='ราคาปิดทะลุกลางโซน single prints แนวนี้ไม่มีใครปกป้องแล้ว';break;
  }
  const r=(b.c-t.entry)*sg/t.dist;
  if(txt){t.invalidAt=i;t.invalidR=r;say('bad',`Setup หลุด (ไม้ ${A.trades.length+1}): ${txt} (ถ้าปิดตอนนี้ ${fr(r)}R)`);if(DF.pauseOnInvalid)halt();return}
  if(i-t.i>=Math.round(90/S.mins)&&!t.slow&&r<.3){t.slow=true;say('warn','ถือมา 90 นาทีแล้วราคายังไม่ไปไหน setup ที่ดีมักทำงานเร็ว พิจารณาลดความเสี่ยงหรือปิด')}
}
/* --- coach: where a structural stop would have gone --- */
function sugStop(t){const S=A.S,p=S.prior,i=t.i,u=S.U,sg=t.side,P=prof(S,i+1);let lo=1e9,hi=-1e9;
  for(let k=Math.max(0,i-5);k<=i;k++){lo=Math.min(lo,S.bars[k].l);hi=Math.max(hi,S.bars[k].h)}
  const swing=sg>0?lo-.2*u:hi+.2*u;let s=swing;
  switch(t.tag){
   case'eighty':s=sg>0?p.val-.3*u:p.vah+.3*u;break;
   case'accept':if(i>=S.ibn-1)s=sg>0?P.ibh-.35*u:P.ibl+.35*u;break;
   case'vwap':s=sg>0?Math.min(lo,S.vw[i]-.5*S.sd[i])-.15*u:Math.max(hi,S.vw[i]+.5*S.sd[i])+.15*u;break;
   case'single':if(t.ref!=null)s=t.ref-sg*.15*u;break;
  }
  if((t.entry-s)*sg<=.2)s=swing;return(t.entry-s)*sg>.2?r1(s):null}
function postMortem(t,k){const S=A.S,i=t.i,sg=t.side;
  if(t.why==='stop ที่ทุน'){say('info',`ไม้ ${k}: ออกที่ทุน ปกป้องกำไรได้ แต่ระวังการย้าย stop เร็วเกินไปจนโดนเขี่ยออกก่อนราคาไปถึงเป้า`);return}
  if(t.why==='ถึงเป้า'){say('good',`ไม้ ${k}: ถึงเป้า ${fr(t.R)}R ทำตามแผนครบ`);return}
  if(t.why!=='โดน stop'){
    if(t.invalidAt!=null&&t.exitI>=t.invalidAt){if(t.R>-.7){t.cutGood=true;say('good',`ไม้ ${k}: ปิดหลัง setup หลุด ${fr(t.R)}R เสียน้อยกว่ารอโดน stop −1R วินัยดี`)}else say('info',`ไม้ ${k}: ปิดหลัง setup หลุด ${fr(t.R)}R จุดที่ setup หลุดอยู่ใกล้ stop แปลว่า stop วางถูกที่ตามโครงสร้าง`)}
    else if(t.why==='ปิดเอง'&&t.R<0)say('warn',`ไม้ ${k}: ปิดขาดทุน ${fr(t.R)}R ก่อน stop ทั้งที่ setup ยังไม่หลุด ถ้าไม่มีเหตุผลใหม่ ให้ stop ทำหน้าที่ อย่าปิดเพราะความกลัว`);
    else if(t.why==='ปิดเอง'&&t.target!=null){const pl=Math.abs(t.target-t.entry)/t.dist;say(t.R<pl*.5?'info':'good',t.R<pl*.5?`ไม้ ${k}: ปิดกำไร ${fr(t.R)}R เร็วกว่าแผน (เป้า ${pl.toFixed(1)}R) กำไรที่ตัดสั้นทำให้ expectancy ลดลง`:`ไม้ ${k}: ปิด ${fr(t.R)}R`)}
    else say('info',`ไม้ ${k}: ${t.why} ${fr(t.R)}R`);
    return}
  const why=[];
  if(t.invalidAt!=null){t.heldInvalid=true;why.push(`setup หลุดตั้งแต่ ${tm(t.invalidAt)} (ตอนนั้น ${fr(t.invalidR)}R) แต่ถือจนโดน stop ครั้งหน้าให้ปิดเมื่อเหตุผลของการเทรดหายไป`)}
  let rg=0,c=0;for(let j=Math.max(0,i-5);j<=i;j++){rg+=S.bars[j].h-S.bars[j].l;c++}rg/=c;
  if(t.dist<rg*.9)why.push(`stop ห่าง ${f1(t.dist)} จุด แต่แท่ง ${S.mins} นาทีช่วงนั้นกว้างเฉลี่ย ${f1(rg)} จุด stop อยู่ในระยะ noise`);
  const s=sugStop(t);t.sug=s;if(s!=null&&(sg>0?t.stop0>s+.3:t.stop0<s-.3))why.push(`stop ตามโครงสร้างของ ${tagName(t.tag)} ควรอยู่ราว ${f1(s)} (คุณวาง ${f1(t.stop0)})`);
  const sl=S.vw[i]-S.vw[Math.max(0,i-6)];if(sg*(t.entry-S.vw[i])<0&&sg*sl<0)why.push(`เข้า ${sg>0?'Long ใต้':'Short เหนือ'} VWAP ที่${sg>0?'ชันลง':'ชันขึ้น'} = สวนฝั่งที่คุมตลาด`);
  if(t.notes.length)why.push('โค้ชเตือนไว้ตอนเข้า: '+t.notes[0]);
  t.why2=why;
  say(why.length?'bad':'info',`ไม้ ${k} โดน stop ${fr(t.R)}R · `+(why.length?why.join(' · '):'ทำตามแผนและ stop อยู่ตามโครงสร้าง นี่คือขาดทุนปกติของ setup ไม่ต้องแก้อะไร'));
  A.follow.push({t,k,at:Math.min(S.nb-1,t.exitI+Math.round(60/S.mins))})}
function followUps(i,force){A.follow=A.follow.filter(f=>{if(i<f.at&&!force)return true;const t=f.t,S=A.S,sg=t.side,end=Math.min(i,f.at);if(end<=t.exitI)return false;
  let fav=-1e9,adv=-1e9;for(let j=t.exitI+1;j<=end;j++){const b=S.bars[j];fav=Math.max(fav,sg>0?b.h-t.entry:t.entry-b.l);adv=Math.max(adv,sg>0?t.stop0-b.l:b.h-t.stop0)}
  let m,lv;
  if(fav>=t.dist){lv='warn';m='หลังโดน stop ราคากลับไปถึง +1R ของไม้นี้ภายใน 1 ชั่วโมง ไอเดียถูก แต่ stop แคบหรืออยู่ผิดที่';t.verdict='ไอเดียถูก stop ผิดที่'}
  else if(adv>=t.dist){lv='good';m='ราคาไปต่ออีก ≥ 1R หลังจุด stop ไอเดียผิดจริง stop ช่วยคุณไว้ นี่คือขาดทุนที่ดี';t.verdict='ขาดทุนที่ดี'}
  else{lv='info';m='ราคาแกว่งไม่ชัดทาง ขาดทุนตามแผนปกติ';t.verdict='ขาดทุนตามแผน'}
  if(t.sug!=null&&(sg>0?t.sug<t.stop0:t.sug>t.stop0)){const dd=Math.abs(t.entry-t.sug);let res=null;
    for(let j=t.i+1;j<=end;j++){const b=S.bars[j];if(sg>0?b.l<=t.sug:b.h>=t.sug){res=false;break}if((sg>0?b.h-t.entry:t.entry-b.l)>=dd){res=true;break}}
    if(res){m+=` · ถ้าวาง stop ตามโครงสร้างที่ ${f1(t.sug)} ไม้นี้จะได้ +1R`;t.verdict='stop แคบเกิน'}}
  say(lv,`ติดตามผลไม้ ${f.k}: ${m}`);return false})}

/* --- orders --- */
function beginOrder(side,force){if(A.ended)return;if(A.locked){hint('การเทรดถูกล็อกจนจบวัน');return}if(A.pos){hint('มีสถานะอยู่แล้ว ปิดก่อนเปิดไม้ใหม่');return}
  const tag=$('#tag').value;if(!tag){hint('เลือก setup ก่อนเข้าเทรด ทุกไม้ต้องมีเหตุผล');$('#tag').focus();return}
  const i=A.n-1,price=A.S.bars[i].c;
  if(DF.preCheck&&!force){const n=tagNotes(tag,side,price,i);if(n.length){stopPlay();const pe=$('#pre');pe.hidden=false;
    pe.innerHTML=`<b>โค้ชเตือนก่อนเข้า ${side>0?'Long':'Short'} (${tagName(tag)})</b><ul>${n.map(x=>`<li>${x}</li>`).join('')}</ul><div class="two"><button class="btn" id="preGo">เข้าต่อ</button><button class="btn primary" id="preNo">ยกเลิก</button></div>`;
    $('#preGo').onclick=()=>{pe.hidden=true;beginOrder(side,true)};$('#preNo').onclick=()=>{pe.hidden=true;say('good','ยกเลิกไม้ที่ไม่เข้าเงื่อนไข การไม่เทรดก็คือการตัดสินใจที่ดี')};return}}
  if(!DF.noPause)stopPlay();
  A.pending={side,tag,risk:+$('#risk').value,price,stage:'stop',override:!!force};A.chart.set({pick:true,lines:[{p:price,col:C.fg,label:'เข้า',dash:[2,3]}]});
  hint(`${side>0?'Long':'Short'} ที่ ${f1(price)} · คลิกบนกราฟเพื่อวาง STOP (${side>0?'ต่ำกว่า':'สูงกว่า'}ราคาเข้า)${DF.noPause?' · ตลาดยังวิ่งอยู่!':''}`);$('#pendBtns').hidden=false;$('#noT').hidden=true;updArena()}
function onArenaPick(pr,raw,bi){if(A.avMode&&!A.pending){A.avMode=false;A.chart.set({pick:false});if(bi==null||bi>=A.n){hint('คลิกบนแท่งเทียนที่เกิดขึ้นแล้ว');return}if(A.avw.length>=3)A.avw.shift();
    A.avw.push({i0:bi,col:['#7ee0c3','#ffb86b','#b6a4ff'][A.avw.length%3],label:'AVWAP '+tm(bi)});A.chart.set({avwaps:A.avw.slice()});$('#avClr').hidden=false;hint(`เริ่ม AVWAP จากแท่ง ${tm(bi)} แล้ว (สูงสุด 3 เส้น)`);return}
  const pd=A.pending;if(!pd)return;const p=r1(raw);const ref=DF.noPause?A.S.bars[A.n-1].c:pd.price;
  if(pd.stage==='stop'){if((ref-p)*pd.side<=.05){hint(`Stop ต้อง${pd.side>0?'ต่ำกว่า':'สูงกว่า'}ราคา ${f1(ref)} ลองคลิกใหม่`);return}pd.stop=p;pd.stage='target';
    A.chart.set({lines:[{p:ref,col:C.fg,label:'เข้า',dash:[2,3]},{p,col:C.sell,label:'STOP'}]});
    const dist=Math.abs(ref-p),q=Math.max(1,Math.floor(A.acct*pd.risk/100/(dist*A.pv)));hint(`Stop ${f1(p)} (${f1(dist)} จุด → ${q} สัญญา) · คลิกเพื่อวางเป้าหมาย หรือกด “ไม่มีเป้า”`);$('#noT').hidden=false}
  else if(pd.stage==='target'){if((p-ref)*pd.side<=.05){hint('เป้าหมายต้องอยู่ฝั่งกำไร ลองคลิกใหม่');return}openPos(p)}}
function openPos(target){const pd=A.pending,S=A.S,i=A.n-1;const entry=r1((DF.noPause?S.bars[i].c:pd.price)+pd.side*DF.slip);
  A.pending=null;$('#pendBtns').hidden=true;
  if((entry-pd.stop)*pd.side<=.05||(target!=null&&(target-entry)*pd.side<=.05)){A.chart.set({pick:false,lines:[]});hint('');say('bad','ราคาวิ่งผ่านระดับที่วางไว้ระหว่างวางคำสั่ง คำสั่งถูกยกเลิก ในตลาดจริงต้องตัดสินใจให้เร็วและชัด');updArena();return}
  const dist=Math.abs(entry-pd.stop),q=Math.max(1,Math.floor(A.acct*pd.risk/100/(dist*A.pv)));
  const t={side:pd.side,tag:pd.tag,entry,stop:pd.stop,stop0:pd.stop,target,i,q,risk$:q*dist*A.pv,dist,override:pd.override};t.riskPct=t.risk$/A.acct*100;
  t.notes=tagNotes(t.tag,t.side,entry,i).concat(riskNotes(t));t.revenge=A.trades.length>0&&i-A.lastLossI<=Math.max(1,Math.round(10/S.mins));t.ref=refOf(t);
  const tot=A.trades.reduce((a,x)=>a+x.R,0);t.afterLimit=DF.lossLock==null&&tot<=-3;
  A.pos=t;A.chart.set({pick:false,lines:posLines(),trades:A.trades.concat([t])});
  if(t.notes.length)say('warn',`ไม้ ${A.trades.length+1}: ${t.notes.join(' · ')}`);
  if(t.revenge)say('warn','เข้าไม้ใหม่ภายใน 10 นาทีหลังขาดทุน ระวัง revenge trade');
  if(t.afterLimit)say('bad','ขาดทุนถึง −3R แล้วยังเปิดไม้ใหม่ ผิดกฎ daily loss limit');
  hint(DF.slip?`เข้าที่ ${f1(entry)} (รวม slippage ${DF.slip} จุด)`:'เข้าเทรดแล้ว กด ▶ เล่นต่อ');updArena()}
function closePos(px,i,why){const t=A.pos;t.exit=px;t.exitI=i;t.why=why;t.R=(px-t.entry)*t.side/t.dist;t.pnl=(px-t.entry)*t.side*t.q*A.pv;A.trades.push(t);A.pos=null;if(t.R<0)A.lastLossI=i;
  const k=A.trades.length;hint(`${why} ${fr(t.R)}R`);postMortem(t,k);renderLog();A.chart.set({lines:[],trades:A.trades});
  const tot=A.trades.reduce((a,x)=>a+x.R,0),l2=A.trades.slice(-2);
  if(l2.length===2&&l2.every(x=>x.R<-.05))say('warn','ขาดทุน 2 ไม้ติด หยุดดูภาพรวมก่อน: วันนี้เป็นวันแบบไหน setup ที่ใช้ยังเข้ากับวันนี้ไหม');
  if(DF.lossLock!=null&&tot<=DF.lossLock+1e-9&&!A.locked){A.locked=true;say('bad',`ขาดทุนรวม ${fr(tot)}R ถึง daily loss limit ${DF.lossLock}R ล็อกการเทรดจนจบวัน`)}
  else if(DF.lossLock==null&&tot<=-3&&!A.flags.w3){A.flags.w3=true;say('bad','ขาดทุนรวมถึง −3R ในตลาดจริงควรหยุดเทรดวันนี้')}
  if(DF.maxTrades&&k>=DF.maxTrades&&!A.locked){A.locked=true;say('info',`ครบ ${DF.maxTrades} ไม้แล้ว ล็อกการเทรดจนจบวัน`)}
  updArena()}
function posLines(){const t=A.pos;if(!t)return[];const L=[{p:t.entry,col:C.fg,label:'เข้า',dash:[2,3]},{p:t.stop,col:C.sell,label:'STOP'}];if(t.target!=null)L.push({p:t.target,col:C.buy,label:'เป้า'});return L}
function renderLog(){const L=$('#log');if(!A.trades.length){L.innerHTML='<span style="color:var(--muted)">ยังไม่มีไม้</span>';return}
  L.innerHTML=A.trades.slice().reverse().map(t=>`<div class="tr ${t.R>=0?'w':'l'}"><b>${t.side>0?'Long':'Short'}</b> ${f1(t.entry)} → ${f1(t.exit)} · <b class="mono">${fr(t.R)}R</b><div class="n">${tagName(t.tag)} · ${t.why} · ${t.q} สัญญา</div></div>`).join('')}
function updArena(){if(!A||!$('#sT'))return;const S=A.S,i=A.n-1,b=S.bars[i];$('#sT').textContent=tm(i)+' '+LET[Math.floor(i/S.per)];$('#sP').textContent=f1(b.c);$('#sV').textContent=f1(S.vw[i]);
  const ps=A.pos;if(ps){const r=(b.c-ps.entry)*ps.side/ps.dist;$('#sO').innerHTML=`<span style="color:${ps.side>0?C.buy:C.sell}">${ps.side>0?'L':'S'}${ps.q}</span> ${fr(r)}R`;
    $('#posBox').innerHTML=`<div class="pos">${ps.side>0?'Long':'Short'} ${ps.q} สัญญา @ ${f1(ps.entry)}<br>Stop ${f1(ps.stop)} · เป้า ${ps.target!=null?f1(ps.target):'—'}<br>เสี่ยง ${fmt(ps.risk$)} ${A.cur} (${ps.riskPct.toFixed(1)}%)${ps.invalidAt!=null?'<br><span style="color:var(--sell)">Setup หลุดแล้ว</span>':''}</div>`;$('#posBtns').hidden=false}
  else{$('#sO').textContent=A.locked?'ล็อก':'ว่าง';$('#posBox').innerHTML='';$('#posBtns').hidden=true}
  const tr=A.trades.reduce((a,t)=>a+t.R,0);$('#sR').innerHTML=`<span style="color:${tr>=0?C.buy:C.sell}">${fr(tr)}R</span>`;
  const blk=A.ended||(!!A.pending&&!DF.noPause);$('#bL').disabled=$('#bS').disabled=A.ended||!!A.pos||A.locked||!!A.pending;$('#tStep').disabled=$('#t30').disabled=$('#tPlay').disabled=blk}
function endSession(){if(A.ended)return;stopPlay();if(A.pending){A.pending=null;$('#pendBtns').hidden=true}if(A.pos)closePos(r1(A.S.bars[A.S.nb-1].c-A.pos.side*DF.slip),A.S.nb-1,'ปิดสิ้นวัน');followUps(A.S.nb-1,true);A.ended=true;updArena();
  const S=A.S,T=A.trades,tot=T.reduce((a,t)=>a+t.R,0),ty=classify(S);let disc=100;const pen=[];
  T.forEach((t,k)=>{const n=k+1;
    if(t.riskPct>2.05){disc-=15;pen.push(`ไม้ ${n}: เสี่ยงเกิน 2% (−15)`)}
    if(t.revenge){disc-=10;pen.push(`ไม้ ${n}: เข้าซ้ำทันทีหลังขาดทุน (−10)`)}
    if(t.notes.length){disc-=5;pen.push(`ไม้ ${n}: ${t.notes[0]} (−5)`)}
    if(!DF.maxTrades&&k>=4){disc-=10;pen.push(`ไม้ ${n}: เกิน 4 ไม้ต่อวัน (−10)`)}
    if(t.afterLimit){disc-=10;pen.push(`ไม้ ${n}: เทรดต่อหลังถึง −3R (−10)`)}
    if(t.heldInvalid){disc-=5;pen.push(`ไม้ ${n}: ถือต่อหลัง setup หลุดจนโดน stop (−5)`)}
    if(t.cutGood){disc+=5;pen.push(`ไม้ ${n}: ปิดเมื่อ setup หลุด (+5)`)}
    if(ty==='trend'&&t.side!==Math.sign(S.bars[S.nb-1].c-S.open))pen.push(`ไม้ ${n}: สวนเทรนด์ในวันเทรนด์`)});
  disc=clamp(disc,0,100);if(!T.length)pen.push('ไม่ได้เทรดเลย การรอคือทางเลือกที่ดีถ้าไม่มี setup แต่ลองหา setup ที่ชัดเจนในวันถัดไป');
  const xp=Math.round((T.length?(30+20*clamp(tot,0,3.5))*disc/100:10)*DF.xp);const ar=prog.arena,counts=A.dk!=='easy';
  if(counts){ar.n++;ar.sumR+=tot;ar.disc+=T.length?disc:100}
  const heroNow=counts&&!prog.hero&&ar.n>=3&&ar.sumR>0&&ar.disc/ar.n>=80;if(heroNow)prog.hero=true;save();addXP(xp,'Arena');if(heroNow)setTimeout(()=>toast('ยินดีด้วย! คุณได้ยศ HERO'),2500);
  renderCoach();
  const kn=KN[S.kind]||'',wins=T.filter(t=>t.R>0).length,sn=SCNN[S.kind]||OTN[S.kind];
  $('#debrief').innerHTML=`<div class="debrief"><p class="eyebrow">สรุปวัน · ระดับ${DF.n}</p><h2>${DTN[ty]}${sn?' · '+sn:''}</h2>
    ${S.src==='gc'?`<p><b>ข้อมูลจริง ${REAL.name} (${REAL.sym})</b> · session วันที่ ${S.date} (เวลานิวยอร์ก 18:00 วันก่อนหน้า ถึง 17:00) · ช่วง ${f1(prof(S).hi-prof(S).lo)} ดอลลาร์ · เวลาที่แสดงเป็นเวลาไทย</p><p style="color:var(--muted);font-size:13px">ประเภทวันวัดเทียบกับ IB ชั่วโมงแรกของ session (ช่วงเอเชีย) ซึ่งมักแคบ วันทองจริงจึงถูกจัดเป็น Trend/Neutral บ่อยกว่าตำราที่ใช้ IB ของช่วงสหรัฐฯ</p>`:''}
    <p>${DTX[ty]}</p>${kn?`<p style="color:var(--muted)">${kn}</p>`:''}
    ${S.failed?`<p class="hint">วันนี้ ${SCNN[S.kind]} เกิดขึ้นตอน ${tm(S.q-1)} แต่ล้มเหลว (fakeout) setup ที่ถูกตำราก็แพ้ได้ สิ่งที่ตัดสินผลลัพธ์คือ stop ตามโครงสร้าง และการปิดเมื่อ setup หลุด</p>`:''}
    <p style="color:var(--muted)">${LOCN[openLoc(S)]} · IB ${f1(prof(S).ibh-prof(S).ibl)} จุด${DF.slip?` · slippage ${DF.slip} จุดต่อการเข้าและการโดน stop`:''}</p>
    <div class="kv"><div><small>รวมวันนี้</small><b style="color:${tot>=0?C.buy:C.sell}">${fr(tot)}R</b></div><div><small>ไม้ / ชนะ</small><b>${T.length} / ${wins}</b></div><div><small>วินัย</small><b>${disc}</b></div><div><small>XP</small><b>+${xp}</b></div>
      <div><small>Arena สะสม</small><b>${ar.n} วัน · ${ar.sumR>=0?'+':''}${ar.sumR.toFixed(1)}R</b></div><div><small>วินัยเฉลี่ย</small><b>${ar.n?Math.round(ar.disc/ar.n):'—'}</b></div></div>
    ${T.length?`<div class="tbl"><table><thead><tr><th>#</th><th>ฝั่ง</th><th>Setup</th><th>เข้า</th><th>Stop</th><th>ออก</th><th>R</th><th>${A.cur}</th><th>วิเคราะห์</th></tr></thead><tbody>${T.map((t,k)=>`<tr><td>${k+1}</td><td><span class="pill ${t.side>0?'g':'r'}">${t.side>0?'Long':'Short'}</span></td><td>${tagName(t.tag)}</td><td class="num">${tm(t.i)} ${f1(t.entry)}</td><td class="num">${f1(t.stop0)}${t.sug!=null&&t.why==='โดน stop'?`<br><span style="color:var(--muted)">ควร ${f1(t.sug)}</span>`:''}</td><td class="num">${f1(t.exit)}</td><td class="num" style="color:${t.R>=0?C.buy:C.sell}">${fr(t.R)}</td><td class="num">${fmt(t.pnl)}</td><td>${t.verdict||(t.cutGood?'ปิดตอน setup หลุด':t.heldInvalid?'ถือหลัง setup หลุด':t.why)}</td></tr>`).join('')}</tbody></table></div>`:''}
    ${pen.length?`<div><small style="color:var(--muted)">คะแนนวินัย</small><ul style="margin:6px 0 0;padding-left:20px">${pen.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:''}
    ${coachTable(T,tot)}
    <div><small style="color:var(--muted)">บันทึกโค้ชทั้งวัน</small><div class="coach full">${A.coach.map(m=>`<div class="cm ${m.lv}"><span class="mono">${tm(Math.max(0,m.i))}</span> ${m.txt}</div>`).join('')}</div></div>
    <p style="color:var(--muted);font-size:13px">${!counts?'โหมดฝึกหัดไม่นับเข้าเงื่อนไข Hero ลองระดับมาตรฐานขึ้นไปเมื่อพร้อม · ':''}${prog.hero?'คุณได้ยศ Hero แล้ว ขั้นต่อไป: paper trade ด้วยข้อมูลจริง 20 วันทำการ ก่อนใช้เงินจริงขนาดเล็กที่สุด':`เงื่อนไข Hero (ระดับมาตรฐานขึ้นไป): เล่นครบ 3 วัน (ตอนนี้ ${ar.n}) · R สะสม &gt; 0 · วินัยเฉลี่ย ≥ 80`}</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="aNew2">เล่นวันใหม่</button></div></div>`;
  A.chart.set({ctrades:A.coachT});const sc=$('#showC');if(sc){sc.checked=true;sc.disabled=true}
  $('#aNew2').onclick=()=>go('arena');hint('ตลาดปิดแล้ว ไม้ของโค้ช (◇ สีม่วง) แสดงบนกราฟแล้ว ดูสรุปด้านล่าง');$('#debrief').scrollIntoView({behavior:reduced?'auto':'smooth',block:'start'})}

renderRank();go('home');
</script>
