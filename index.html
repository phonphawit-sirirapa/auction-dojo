<title>Auction Dojo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: trading-desk console. A status rail on top, one working column (max 1120px),
   charts are the primary surface; lessons and tickets sit beside or under them. Single dark look by choice. */
:root{
  color-scheme:dark;
  --ink:#0c121a;        /* page ground: blue-black desk */
  --panel:#131b26;      /* cards */
  --panel2:#192331;     /* raised controls */
  --line:#253244;
  --fg:#e2e8ef;
  --muted:#8e9bac;
  --brass:#e6ae4f;      /* accent: value / pit-card amber */
  --brass-soft:rgba(230,174,79,.16);
  --buy:#41bf9f;
  --sell:#ec6b65;
  --vwap:#a0b5ff;
  --ib:#c99af0;
  --display:"Chakra Petch","IBM Plex Sans Thai",system-ui,sans-serif;
  --body:"IBM Plex Sans Thai",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--ink);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:var(--brass)}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.2}
p{margin:0}

/* top rail */
.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(12,18,26,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.rail .wrap{display:flex;align-items:center;gap:14px;padding-block:10px}
.brand{font-family:var(--display);font-weight:700;letter-spacing:.04em;font-size:17px;cursor:pointer;background:none;border:0;padding:0;display:flex;align-items:center;gap:8px}
.brand i{display:inline-grid;grid-template-columns:repeat(3,4px);gap:2px}
.brand i b{display:block;width:4px;background:var(--brass);border-radius:1px}
.rank{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0}
.rank .t{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--brass);white-space:nowrap}
.xpbar{width:120px;height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--brass)}
.rank .x{font-size:12px;color:var(--muted);white-space:nowrap}
@media (max-width:520px){.xpbar{width:64px}.rank .x{display:none}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-weight:500;min-height:40px;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brass);border-color:var(--brass);color:#1a1307;font-weight:600}
.btn.primary:hover{background:#f0bd62}
.btn.buy{background:rgba(65,191,159,.14);border-color:var(--buy);color:var(--buy);font-weight:600}
.btn.sell{background:rgba(236,107,101,.14);border-color:var(--sell);color:var(--sell);font-weight:600}
.btn:disabled{opacity:.4;cursor:not-allowed}
.link{background:none;border:0;color:var(--muted);cursor:pointer;padding:4px 0;font-size:14px}
.link:hover{color:var(--fg)}
.eyebrow{font-family:var(--display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);font-weight:600}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:32px;align-items:center;padding-block:40px 28px}
.hero h1{font-size:clamp(30px,4.4vw,48px);font-weight:700;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--brass)}
.hero .lede{color:var(--muted);margin-top:14px;max-width:46ch;font-size:16px}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.hero .live{min-width:0}
.hero .cap{font-size:12px;color:var(--muted);margin-top:8px;display:flex;justify-content:space-between;gap:8px}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr);padding-block:24px 12px}}

.path{padding-block:20px 48px}
.path h2{font-size:22px;margin-bottom:6px}
.path .sub{color:var(--muted);margin-bottom:18px}
.levels{display:grid;gap:10px}
.lv{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;text-align:left;width:100%}
.lv:hover:not(.locked){border-color:var(--muted)}
.lv .no{font-family:var(--display);font-size:28px;font-weight:700;color:var(--muted);text-align:center;line-height:1}
.lv.done .no{color:var(--buy)}
.lv.cur .no{color:var(--brass)}
.lv .ti{font-family:var(--display);font-weight:600;font-size:17px}
.lv .ti small{font-family:var(--mono);font-weight:400;font-size:12px;color:var(--muted);margin-left:8px;letter-spacing:.02em}
.lv .bl{color:var(--muted);font-size:14px}
.lv .st{font-size:12px;font-family:var(--mono);padding:4px 10px;border-radius:99px;border:1px solid var(--line);white-space:nowrap;color:var(--muted)}
.lv.done .st{color:var(--buy);border-color:rgba(65,191,159,.4)}
.lv.cur .st{color:var(--brass);border-color:rgba(230,174,79,.5)}
.lv.locked{opacity:.45;cursor:not-allowed}
.key.wrap{white-space:pre-wrap}.tblwrap{overflow-x:auto}.vt{border-collapse:collapse;font-size:13px;width:100%}.vt th,.vt td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.vt th{color:var(--muted);font-weight:500}
.lv.arena{background:linear-gradient(90deg,rgba(230,174,79,.10),transparent 60%),var(--panel)}
@media (max-width:520px){.lv{grid-template-columns:40px minmax(0,1fr);}.lv .st{grid-column:2;justify-self:start}.lv .no{font-size:22px}}
.foot{color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-block:20px 40px;display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between}
.confirm{display:inline-flex;gap:8px;align-items:center}

/* chart */
.chart{background:#0f1620;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.chart canvas{display:block;width:100%;height:clamp(300px,44vw,460px);touch-action:pan-y}
.chart.tall canvas{height:clamp(420px,72vh,900px)}
.tg .zoom{display:inline-flex;gap:4px;margin-left:auto}
.tg .zoom button{min-width:30px;justify-content:center;color:var(--fg)}
.tg .zoom button[aria-pressed="true"]{background:var(--panel2);border-color:#3a4a60}
.chart.pick canvas{cursor:crosshair}
.tg{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line)}
.tg button{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:transparent;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.tg button i{width:8px;height:8px;border-radius:2px;display:inline-block;background:currentColor;opacity:.35}
.tg button[aria-pressed="true"]{color:var(--fg);border-color:#3a4a60;background:var(--panel2)}
.tg button[aria-pressed="true"] i{opacity:1}

/* chapter */
.chhead{padding-block:22px 10px;display:flex;flex-direction:column;gap:6px}
.chhead h1{font-size:clamp(24px,3.4vw,34px)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:10px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--brass)}
.lesson{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:24px;padding-block:22px;align-items:start}
.lesson.nodemo{grid-template-columns:minmax(0,1fr);max-width:720px}
@media (max-width:860px){.lesson{grid-template-columns:minmax(0,1fr)}}
.ltext h2{font-size:24px;margin-bottom:12px}
.ltext .body{display:flex;flex-direction:column;gap:12px;max-width:62ch}
.ltext ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.ltext b{color:#fff;font-weight:600}
.key{font-family:var(--mono);font-size:13.5px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--brass);padding:10px 14px;border-radius:6px;overflow-x:auto;white-space:pre}
.tip{font-size:14px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}
.lnav{display:flex;align-items:center;gap:10px;justify-content:space-between;padding-block:4px 32px;flex-wrap:wrap}
.dots{display:flex;gap:6px}
.dots i{width:22px;height:4px;border-radius:2px;background:var(--line)}
.dots i.on{background:var(--brass)}
.dots i.seen{background:#5b6b80}
.demo-cap{font-size:13px;color:var(--muted);margin-top:8px}

/* drill */
.drill{padding-block:18px 48px}
.dh{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.pbar{flex:1;height:4px;background:var(--panel2);border-radius:2px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--brass)}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.qtext{font-size:17px;font-weight:500;max-width:70ch}
.qhint{font-size:13px;color:var(--muted)}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.opt:hover:not(:disabled){border-color:var(--muted)}
.opt .k{font-family:var(--mono);color:var(--muted);font-size:13px;padding-top:2px}
.opt.right{border-color:var(--buy);background:rgba(65,191,159,.10)}
.opt.wrong{border-color:var(--sell);background:rgba(236,107,101,.10)}
.opt:disabled{cursor:default}
.numrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.numrow input{font-family:var(--mono);font-size:16px;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--ink);color:var(--fg);width:180px;max-width:100%}
.feedback{border-radius:8px;padding:12px 14px;border:1px solid var(--line);background:var(--ink);display:flex;flex-direction:column;gap:8px;max-width:76ch}
.feedback .v{font-family:var(--display);font-weight:600;font-size:16px}
.feedback.ok .v{color:var(--buy)}
.feedback.bad .v{color:var(--sell)}
.feedback.mid .v{color:var(--brass)}
.qnav{display:flex;justify-content:flex-end}
.result{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:28px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.result .big{font-family:var(--display);font-size:56px;font-weight:700;line-height:1}
.result .row{display:flex;gap:10px;flex-wrap:wrap}

/* arena */
.arena{padding-block:18px 48px}
.ahead{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.ahead h1{font-size:26px}
.agrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:900px){.agrid{grid-template-columns:minmax(0,1fr)}}
.strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:10px}
.strip div{background:var(--panel);padding:8px 10px;min-width:0}
.strip small{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.strip b{font-family:var(--mono);font-weight:500;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:560px){.strip{grid-template-columns:repeat(3,minmax(0,1fr))}.strip div:nth-child(n+4){display:none}}
.transport{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.transport select,.ticket select{font:inherit;font-size:14px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);min-height:40px;max-width:100%}
.ticket{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.ticket label{font-size:12px;color:var(--muted);letter-spacing:.04em;display:flex;flex-direction:column;gap:4px}
.ticket .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hint{font-size:13px;padding:8px 10px;border-radius:6px;background:var(--brass-soft);color:#f3d29a;min-height:20px}
.hint:empty{display:none}
.pos{font-family:var(--mono);font-size:13px;border:1px dashed var(--line);border-radius:6px;padding:8px 10px}
.log{display:flex;flex-direction:column;gap:6px;font-size:13px;max-height:260px;overflow:auto}
.log .tr{border-left:3px solid var(--line);padding:4px 8px;background:var(--ink);border-radius:0 6px 6px 0}
.log .tr.w{border-color:var(--buy)}
.log .tr.l{border-color:var(--sell)}
.log .tr .n{color:var(--muted);font-size:12px}
.debrief{margin-top:16px;background:var(--panel);border:1px solid var(--brass);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px}
.debrief h2{font-size:22px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kv div{background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.kv small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kv b{font-family:var(--mono);font-size:18px;font-weight:500}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
.tbl th,.tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{color:var(--muted);font-weight:500;font-size:12px}
.tbl td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line)}
.pill.g{color:var(--buy);border-color:rgba(65,191,159,.4)}
.pill.r{color:var(--sell);border-color:rgba(236,107,101,.4)}
.diffbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:12px}
.diff{display:flex;gap:4px;padding:3px;background:var(--panel);border:1px solid var(--line);border-radius:10px;flex-wrap:wrap}
.diff button{background:none;border:0;padding:6px 12px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500;display:flex;gap:6px;align-items:baseline}
.diff button small{font-family:var(--mono);font-size:11px;opacity:.7}
.diff button[aria-checked="true"]{background:var(--brass);color:#1a1307}
.diffd{font-size:13px;color:var(--muted);flex:1;min-width:220px}
.coachbox{margin-top:12px}.coachbox>small{font-size:12px;color:var(--muted)}
.coach{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.coach.full{max-height:340px;overflow:auto}
.cm{font-size:13px;padding:6px 10px;border-left:3px solid var(--muted);background:var(--panel);border-radius:0 6px 6px 0}
.cm .mono{color:var(--muted);font-size:12px;margin-right:4px}
.cm.warn{border-color:var(--brass)}.cm.bad{border-color:var(--sell);background:rgba(236,107,101,.08)}.cm.good{border-color:var(--buy)}
.pre{border:1px solid var(--sell);background:rgba(236,107,101,.08);padding:10px 12px;border-radius:8px;font-size:13px;display:flex;flex-direction:column;gap:8px}
.pre ul{margin:0;padding-left:18px}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);cursor:pointer}
.chk input{accent-color:var(--ib);width:16px;height:16px}
.ccard{border:1px solid rgba(201,154,240,.45);background:rgba(201,154,240,.06);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.ccard .ch{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}.ccard .ch>b{color:var(--ib);font-family:var(--display)}.ccard .ch span{font-size:13px;color:var(--muted)}
.clist{display:flex;flex-direction:column;gap:8px}.ci{background:var(--ink);border:1px solid var(--line);border-left:3px solid var(--sell);border-radius:0 8px 8px 0;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:13.5px}.ci.w{border-left-color:var(--buy)}.cr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.cn{color:var(--muted);font-size:12.5px}.cl{display:inline-block;font-size:11px;color:var(--ib);border:1px solid rgba(201,154,240,.4);border-radius:99px;padding:0 7px;margin-right:4px}
/* end arena extras */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--brass);color:#1a1307;font-weight:600;padding:10px 18px;border-radius:99px;z-index:50;font-family:var(--display);box-shadow:0 8px 30px rgba(0,0,0,.4)}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .3s ease-out}@keyframes pop{from{transform:translate(-50%,12px);opacity:0}}}
</style>

<header class="rail"><div class="wrap">
  <button class="brand" id="brand" aria-label="หน้าแรก"><i><b style="height:8px"></b><b style="height:16px"></b><b style="height:11px"></b></i>AUCTION DOJO</button>
  <div class="rank" id="rank"></div>
</div></header>

/* ============ progress ============ */
const KEY='auctionDojo.v1';
let prog={xp:0,ch:{},arena:{n:0,sumR:0,disc:0},unlockAll:false,hero:false};
try{const s=localStorage.getItem(KEY);if(s)prog=Object.assign(prog,JSON.parse(s))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(prog))}catch(e){}}
const RANKS=[[0,'Zero'],[120,'Tape Watcher'],[300,'Auction Apprentice'],[520,'Value Hunter'],[760,'Profile Reader'],[950,'Setup Specialist'],[1100,'Risk Keeper']];
function rankOf(){if(prog.hero)return{t:'Hero',lo:1100,hi:null};let i=0;RANKS.forEach((r,k)=>{if(prog.xp>=r[0])i=k});return{t:RANKS[i][1],lo:RANKS[i][0],hi:RANKS[i+1]?RANKS[i+1][0]:null}}
function renderRank(){const r=rankOf();const pct=r.hi?clamp((prog.xp-r.lo)/(r.hi-r.lo),0,1)*100:100;
  $('#rank').innerHTML=`<span class="t">${r.t}</span><span class="xpbar" title="XP"><i style="width:${pct}%"></i></span><span class="x mono">${fmt(prog.xp)} XP${r.hi?' / '+fmt(r.hi):''}</span>`}
function addXP(n,msg){if(n<=0)return;const before=rankOf().t;prog.xp+=Math.round(n);save();renderRank();const after=rankOf().t;toast(after!==before?`เลื่อนยศเป็น ${after}!`:`+${Math.round(n)} XP${msg?' · '+msg:''}`)}
function toast(t){const h=$('#toastHost');h.innerHTML=`<div class="toast" role="status">${t}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>h.innerHTML='',2400)}
const chState=id=>prog.ch[id]||(prog.ch[id]={read:false,best:0});

{id:'amt',title:'ตลาดคือการประมูล',en:'Auction Market Theory',blurb:'ทำไมราคาถึงขยับ และ “value” คืออะไร',
 lessons:[
  {h:'ราคาเคลื่อนที่เพื่อหาคู่ค้า',b:`<p>ตลาดมีหน้าที่เดียว: <b>จับคู่ผู้ซื้อกับผู้ขาย</b> ราคาขึ้นเพื่อ “โฆษณา” หาผู้ขาย และลงเพื่อหาผู้ซื้อ</p><p>เมื่อราคาขึ้นไปจนไม่มีผู้ซื้อรายใหม่ ราคาจะถูก <b>ปฏิเสธ</b> และหมุนกลับ เมื่อราคาลงจนผู้ขายหมด ก็เช่นเดียวกัน ทุกแท่งที่คุณเห็นคือผลของการประมูลนี้</p><p class="tip">ในเกมนี้ ทุกวันเทรดสร้างขึ้นใหม่ด้วยเครื่องจำลองตลาด 5 นาที/แท่ง 09:30–16:00 (78 แท่ง)</p>`,
   demo:{kind:'normal',seed:101,show:{...hide},cap:'วันปกติ: ราคาหมุนขึ้นลงเพื่อหาคู่ค้า'}},
  {h:'Balance กับ Imbalance',b:`<p>ตลาดใช้เวลาส่วนใหญ่อยู่ใน <b>balance</b> คือหมุนวนในกรอบ เพราะทั้งสองฝั่งพอใจกับราคา</p><p>เมื่อมีข้อมูลใหม่ ตลาดจะเข้าสู่ <b>imbalance</b> คือวิ่งออกจากกรอบเพื่อหา value ใหม่ แล้วสร้าง balance ใหม่ที่นั่น</p><ul><li>Balance → เทรดสวนที่ขอบกรอบ เป้ากลางกรอบ</li><li>Imbalance → เทรดตามทิศ ห้ามสวน</li></ul><p>งานแรกของเทรดเดอร์ทุกเช้า คือดูว่าวันนี้ตลาดอยู่โหมดไหน</p>`,
   demo:{kind:'double',seed:202,show:{...hide,tpo:true},cap:'Balance ช่วงเช้า → imbalance → balance ใหม่ช่วงบ่าย'}},
  {h:'ราคา × เวลา × ปริมาณ',b:`<p>แท่งเทียนบอกราคาตามเวลา แต่ไม่ได้บอกว่า <b>ราคาไหนถูกยอมรับ</b> เครื่องมือสามตัวในเกมนี้ตอบคำถามนั้น:</p><ul><li><b>TPO</b> = ราคา × เวลา: ราคาอยู่ที่ระดับนั้นนานแค่ไหน</li><li><b>Volume Profile</b> = ราคา × ปริมาณ: ซื้อขายกันที่ระดับนั้นเท่าไร</li><li><b>VWAP</b> = ราคาเฉลี่ยถ่วงปริมาณ: ต้นทุนเฉลี่ยของทุกคนในวันนี้</li></ul><p>ราคาที่มีทั้งเวลาและปริมาณมาก คือราคาที่ตลาด <b>ยอมรับ (acceptance)</b></p><p class="tip">ลองกดปุ่มบนกราฟเพื่อเปิด/ปิดแต่ละเครื่องมือ</p>`,
   demo:{kind:'normalVar',seed:303,toggles:true,show:{vwap:true,vp:true,va:true,tpo:true,prior:false},cap:'กดปุ่มด้านบนเพื่อเปิด/ปิดแต่ละชั้นข้อมูล'}},
  {h:'ใครเป็นคนขยับตลาด',b:`<p>ผู้เล่นแบ่งได้สองกลุ่ม:</p><ul><li><b>Day timeframe</b>: เทรดจบในวัน ทำให้เกิดการหมุนในกรอบ</li><li><b>Other timeframe (OTF)</b>: กองทุนและสถาบันที่ถือหลายวัน มีเงินมาก เมื่อเข้ามาจะดันราคาออกจากกรอบ</li></ul><p>ร่องรอยของ OTF คือ range extension, single prints และวันเทรนด์ ซึ่งคุณจะเรียนในด่านต่อๆ ไป เราไม่รู้ว่าเขาเป็นใคร แต่อ่านรอยเท้าได้จากโปรไฟล์</p>`,
   demo:{kind:'trend',seed:404,show:{...hide,tpo:true,vwap:true},cap:'วันเทรนด์: OTF คุมทั้งวัน โปรไฟล์ผอมยาว'}},
  {h:'Value และคำถามประจำวัน',b:`<p>ช่วงราคาที่มีการซื้อขายประมาณ <b>70%</b> ของวัน เรียกว่า <b>Value Area</b> ราคาที่อยู่ห่างจาก value คือราคาที่ “แพง” หรือ “ถูก” ในสายตาตลาดตอนนั้น</p><p>เมื่อราคาออกนอก value จะเกิดได้สองแบบ:</p><ul><li><b>ยอมรับ</b>: ใช้เวลาและมีปริมาณที่ราคาใหม่ → value ย้าย</li><li><b>ปฏิเสธ</b>: กลับเข้าหา value อย่างรวดเร็ว</li></ul><div class="key">คำถามทุกวัน: ราคานอก value ถูกยอมรับ หรือถูกปฏิเสธ?</div>`,
   demo:{kind:'normal',seed:505,show:{...hide,vp:true,va:true},cap:'แถบสีทอง = Value Area 70% ของปริมาณ'}},
 ],
 drill:s=>[
  mcq('ราคาขึ้นไปทำ high ใหม่ แล้วถูกขายกลับลงมาอย่างรวดเร็วจนเหลือหางยาว สิ่งนี้บอกอะไรตามแนวคิด auction?',['ราคาสูงเกินไปจนไม่มีผู้ซื้อเพิ่ม การประมูลด้านบนถูกปฏิเสธ (excess)','ผู้ซื้อแข็งแรงมาก ควรซื้อตาม','ไม่มีความหมาย เป็นแค่ noise','ตลาดกำลังสร้าง value ใหม่ที่ high นั้น'],0,'ราคาขึ้นไปหาผู้ขาย เมื่อไม่มีผู้ซื้อรายใหม่ที่ราคานั้น ราคาจะถูกปฏิเสธเร็วและทิ้งหางไว้ เรียกว่า excess ซึ่งมักเป็นแนวต้านที่แข็งแรง'),
  mcq('ตลาดอยู่ในภาวะ balance (หมุนในกรอบ) วิธีเทรดที่สอดคล้องที่สุดคือ?',['ขายใกล้ขอบบน ซื้อใกล้ขอบล่าง เป้าหมายกลางกรอบ','ซื้อทุกครั้งที่ราคาทำ high ใหม่','ถือสถานะข้ามวันเพื่อรอเทรนด์','เทรดเฉพาะตอนราคาอยู่กลางกรอบ'],0,'ในภาวะ balance ราคาที่ขอบกรอบมักถูกปฏิเสธ การ fade ขอบโดยมี stop นอกกรอบจึงให้ R:R ดี'),
  mcq('ผู้เล่นกลุ่มไหนเป็นต้นเหตุของ range extension และวันเทรนด์?',['Other timeframe (OTF) เช่น กองทุนที่ถือหลายวัน','Day trader รายย่อย','Market maker ที่ทำราคาในกรอบ','ไม่มีใคร ราคาเคลื่อนแบบสุ่ม'],0,'OTF มีเงินมากพอจะดันราคาออกจากกรอบของ day timeframe'),
  mcq('TPO (Market Profile) วัดอะไรเป็นหลัก?',['เวลาที่ราคาอยู่ในแต่ละระดับ','ปริมาณการซื้อขายในแต่ละระดับ','ราคาเฉลี่ยถ่วงปริมาณ','ความชันของแนวโน้ม'],0,'TPO = Time Price Opportunity นับว่าราคาไปอยู่ที่ระดับนั้นกี่ช่วงเวลา 30 นาที ส่วนปริมาณคืองานของ Volume Profile'),
  mcq('“Acceptance” (การยอมรับราคา) สังเกตได้จากอะไร?',['ราคาอยู่ที่ระดับนั้นนานพอ และมีการซื้อขายหนาแน่น','ราคาแตะระดับนั้นเพียงครั้งเดียว','มีข่าวดีออกมา','แท่งเทียนปิดเป็นสีเขียว'],0,'การยอมรับต้องการทั้งเวลา (TPO สะสม) และปริมาณ ราคาที่แค่แตะแล้วจากไปคือการปฏิเสธ'),
  mcq('ราคาเปิดห่างจาก value เมื่อวานมาก และเทรดหนาแน่นที่ราคาใหม่นานหลายชั่วโมง แปลว่าอะไร?',['value กำลังย้ายไปที่ราคาใหม่ (ตลาดยอมรับ)','ราคาจะกลับไป value เดิมแน่นอน','ตลาดยังอยู่ใน balance เดิม','ปริมาณไม่สำคัญ'],0,'เวลาและปริมาณที่สะสมที่ราคาใหม่คือหลักฐานของการยอมรับ value จึงย้ายตาม'),
 ]},
{id:'vwap',title:'VWAP',en:'Volume Weighted Average Price',blurb:'ต้นทุนเฉลี่ยของวัน ใครคุมตลาด และ σ bands',
 lessons:[
  {h:'VWAP คืออะไร',b:`<p>VWAP คือราคาเฉลี่ยของวันที่ถ่วงด้วยปริมาณ เริ่มคำนวณใหม่ทุกเช้า (session VWAP)</p><div class="key">ราคาตัวแทนแท่ง (TP) = (High + Low + Close) ÷ 3
VWAP = Σ(TP × Volume) ÷ ΣVolume</div><p>VWAP คือ <b>ต้นทุนเฉลี่ยของทุกคนที่เทรดวันนี้</b> ถ้าราคาอยู่เหนือ VWAP คนที่ซื้อวันนี้โดยเฉลี่ยกำลังได้กำไร</p>`,
   demo:{kind:'trend',seed:111,d:1,show:{...hide,vwap:true},cap:'เส้นสีฟ้า = VWAP ในวันเทรนด์ขึ้น'}},
  {h:'ทำไมสถาบันถึงสนใจ',b:`<p>กองทุนที่ต้องซื้อจำนวนมากถูกวัดผลการ execute ด้วย VWAP: ซื้อได้ <b>ต่ำกว่า</b> VWAP = ทำงานดี ขายได้ <b>สูงกว่า</b> = ทำงานดี</p><p>คำสั่งจำนวนมากจึงรออยู่แถว VWAP ทำให้ VWAP มักเป็น <b>แนวรับ/ต้านแบบเคลื่อนที่</b> โดยเฉพาะในวันที่มีทิศทาง</p>`,
   demo:{kind:'trendPull',seed:112,d:1,show:{...hide,vwap:true},cap:'ราคาย่อกลับมาแตะ VWAP แล้วถูกซื้อกลับ'}},
  {h:'อ่านว่าใครคุมตลาด',b:`<ul><li>ราคายืน <b>เหนือ</b> VWAP และ VWAP <b>ชันขึ้น</b> → ผู้ซื้อคุม</li><li>ราคาอยู่ <b>ใต้</b> VWAP และ VWAP <b>ชันลง</b> → ผู้ขายคุม</li><li>VWAP <b>แบน</b> ราคาข้ามไปมา → balance ไม่มีใครคุม</li></ul><p>ความชันสำคัญพอๆ กับตำแหน่ง ราคาเหนือ VWAP ที่แบนราบ ไม่ใช่สัญญาณซื้อที่แข็งแรง</p>`,
   demo:{kind:'normal',seed:113,show:{...hide,vwap:true},cap:'วัน balance: VWAP แบน ราคาข้ามไปมา'}},
  {h:'Standard Deviation Bands',b:`<p>เส้น ±1σ และ ±2σ วัดการกระจายของราคารอบ VWAP (ถ่วงด้วยปริมาณ)</p><ul><li><b>วัน balance</b>: ราคาแตะ ±2σ มักถูกดึงกลับหา VWAP (mean reversion)</li><li><b>วันเทรนด์</b>: ราคาวิ่งระหว่าง VWAP กับ +1σ/+2σ การย่อลงมาที่ VWAP หรือ 1σ คือ <b>จังหวะเข้าตามเทรนด์</b> ไม่ใช่สัญญาณกลับตัว</li></ul><p>ใช้ bands ตัดสินใจหลังจากรู้แล้วว่าวันนี้เป็นวันแบบไหน</p>`,
   demo:{kind:'trend',seed:114,d:-1,show:{...hide,vwap:true,bands:true},cap:'วันเทรนด์ลง: ราคาเกาะอยู่ระหว่าง VWAP กับ −2σ'}},
  {h:'Reclaim, Reject และ Anchored VWAP',b:`<ul><li><b>Reclaim</b>: หลุด VWAP แล้วกลับขึ้นมายืนได้ → ฝั่งขายล้มเหลว</li><li><b>Reject</b>: ขึ้นมาทดสอบ VWAP จากด้านล่างแล้วโดนขาย → ฝั่งขายยังคุม</li></ul><p><b>Anchored VWAP</b> คือ VWAP ที่เริ่มนับจากจุดสำคัญ เช่น low ของ swing หรือวันประกาศงบ ใช้ดูต้นทุนเฉลี่ยของคนที่เข้ามาตั้งแต่จุดนั้น</p><p class="tip">VWAP ไม่ใช่สัญญาณเดี่ยว ใช้ร่วมกับ value area และโครงสร้าง TPO เสมอ</p>`,
   demo:{kind:'neutral',seed:115,show:{...hide,vwap:true,bands:true},cap:'Neutral day: ราคาข้าม VWAP ทั้งสองทาง'}},
 ],
 drill:s=>{const R=mulberry32(s);const qs=[];
  for(let k=0;k<2;k++){const tp=[0,0,0].map(()=>1000+Math.round(R()*12)),v=[0,0,0].map(()=>(1+Math.floor(R()*9))*100);const a=tp.reduce((x,t,i)=>x+t*v[i],0)/v.reduce((x,y)=>x+y,0);
   qs.push({type:'num',q:`คำนวณ VWAP จาก 3 แท่งนี้ (ใช้ TP ที่ให้มา)<div class="key">${tp.map((t,i)=>`แท่ง ${i+1}: TP = ${t}   Volume = ${v[i]}`).join('\n')}</div>`,a:+a.toFixed(2),tol:.06,unit:'จุด',ex:`VWAP = (${tp.map((t,i)=>t+'×'+v[i]).join(' + ')}) ÷ (${v.join(' + ')}) = <b>${a.toFixed(2)}</b> แท่งที่ปริมาณมากดึง VWAP เข้าหาตัวเองมากกว่า`})}
  for(let k=0;k<3;k++){const c=pick(R,['up','dn','bal']);const S=c==='bal'?makeSession('normal',s+k*31):makeSession('trend',s+k*31,{d:c==='up'?1:-1});
   qs.push(mcq('ดูราคาเทียบกับ VWAP ทั้งวัน ใครคุมตลาดวันนี้?',['ผู้ซื้อคุม: ราคายืนเหนือ VWAP ที่ชันขึ้น','ผู้ขายคุม: ราคาอยู่ใต้ VWAP ที่ชันลง','สมดุล: VWAP แบน ราคาข้ามไปมา'],c==='up'?0:c==='dn'?1:2,
    c==='bal'?'VWAP แทบไม่เปลี่ยนความชัน และราคาข้ามไปมาหลายครั้ง ไม่มีฝั่งไหนคุม เหมาะกับการ fade ขอบ':'ราคาอยู่ฝั่งเดียวของ VWAP เกือบทั้งวันและ VWAP ชันไปทางเดียวกัน คนที่เทรดตามทิศโดยเฉลี่ยกำลังได้กำไร',{sess:S,n:NB,show:{...hide,vwap:true,bands:true}}))}
  qs.push(mcq('วันเทรนด์ขึ้น ราคาอยู่เหนือ VWAP มาตลอด แล้วย่อลงมาแตะ VWAP พร้อมมีแรงซื้อกลับ แผนไหนสอดคล้องที่สุด?',['Long ตามเทรนด์ stop ใต้ VWAP / swing low ล่าสุด','Short เพราะราคาเริ่มลง','รอจนราคาไปถึง +2σ แล้วค่อย long','ไม่ต้องดู VWAP ในวันเทรนด์'],0,'ในวันเทรนด์ VWAP คือบริเวณที่สถาบันเติมของ การย่อมาที่ VWAP คือจุดเข้าที่ความเสี่ยงต่ำ'));
  qs.push(mcq('วัน balance VWAP แบน ราคาขึ้นไปแตะ +2σ โดยปริมาณเบาบาง แผนเชิงสถิติคือ?',['มองหาการปฏิเสธ แล้ว fade กลับหา VWAP','Long breakout ทันที','Short โดยไม่ต้องตั้ง stop','เพิ่มขนาดสัญญาเป็นสองเท่า'],0,'ในวัน balance ราคาที่ ±2σ คือราคาที่ยืดออกไปไกลจากต้นทุนเฉลี่ย ถ้าไม่มี acceptance มักกลับหา VWAP'));
  qs.push(mcq('ข้อใดถูกต้องเกี่ยวกับ session VWAP?',['เริ่มคำนวณใหม่ทุกวัน และถ่วงน้ำหนักด้วยปริมาณ','เป็นค่าเฉลี่ยราคาปิด 20 วัน','ไม่ขึ้นกับปริมาณ','คำนวณเฉพาะชั่วโมงแรก'],0,'Session VWAP รีเซ็ตทุกวัน ถ้าต้องการดูต้นทุนข้ามหลายวันให้ใช้ anchored VWAP'));
  return qs}},
{id:'vp',title:'Volume Profile',en:'POC · Value Area · HVN/LVN',blurb:'ราคาไหนตลาดยอมรับ ราคาไหนตลาดปฏิเสธ',
 lessons:[
  {h:'Volume Profile คืออะไร',b:`<p>Histogram แนวนอนที่บอกว่าซื้อขายกันที่แต่ละราคาเท่าไร</p><ul><li>แท่งยาว = เทรดกันมาก → ราคาถูก <b>ยอมรับ</b></li><li>แท่งสั้น = เทรดน้อย → ราคาถูก <b>ปฏิเสธ</b> หรือวิ่งผ่านเร็ว</li></ul><p>ในเกมนี้ 1 แถว = 1 จุดราคา และ volume ของแต่ละแท่งเทียนถูกกระจายเท่าๆ กันตลอดช่วง high–low ของแท่งนั้น</p>`,
   demo:{kind:'normal',seed:211,show:{...hide,vp:true},cap:'Histogram ด้านขวาของแท่งเทียน = volume ต่อระดับราคา'}},
  {h:'POC: ราคาที่ยุติธรรมที่สุด',b:`<p><b>Point of Control (POC)</b> คือราคาที่มี volume มากที่สุด เป็นราคาที่ตลาดเห็นว่า “ยุติธรรมที่สุด” ของช่วงนั้น</p><ul><li>วัน balance ราคามักกลับมาหา POC เหมือนแม่เหล็ก</li><li><b>Naked POC</b> คือ POC ของวันก่อนที่ยังไม่ถูกแตะ มักเป็นเป้าหมายของราคา</li></ul>`,
   demo:{kind:'normalVar',seed:212,show:{...hide,vp:true,va:true},marks:(S,P)=>[{p:P.poc,label:'POC '+P.poc}],cap:'แท่งที่ยาวที่สุด = POC'}},
  {h:'Value Area 70%',b:`<p>เริ่มจาก POC แล้วขยายออกทีละ 2 ระดับราคา ไปฝั่งที่ volume รวมมากกว่า จนรวมได้ <b>70%</b> ของ volume ทั้งหมด</p><div class="key">VAH = ขอบบนของ Value Area
VAL = ขอบล่างของ Value Area
70% ≈ 1 ส่วนเบี่ยงเบนมาตรฐาน (68%) ของการกระจายแบบปกติ</div><p>VAH/VAL ของเมื่อวาน คือแนวอ้างอิงสำคัญที่สุดของวันนี้</p>`,
   demo:{kind:'normal',seed:213,show:{...hide,vp:true,va:true},cap:'เส้นบาง = VAH/VAL, เส้นหนา = POC'}},
  {h:'HVN และ LVN',b:`<ul><li><b>HVN</b> (High Volume Node) = ยอดเขา ราคาถูกยอมรับ เคลื่อนช้า หมุนวน</li><li><b>LVN</b> (Low Volume Node) = หุบเขา ราคาถูกปฏิเสธ มักวิ่งผ่านเร็ว หรือเด้งกลับเมื่อมาทดสอบ</li></ul><div class="key">ราคาไหลจาก HVN → ผ่าน LVN → ไปหา HVN ถัดไป</div><p>LVN จึงเป็นทั้งจุดตัดสินใจ (เด้งหรือทะลุ) และจุดวาง stop ที่ดี</p>`,
   demo:{kind:'double',seed:214,show:{...hide,vp:true},zones:(S,P)=>{const z=lvnZone(P);return z?[{...z,label:'LVN'}]:[]},cap:'Double distribution: สอง HVN และ LVN ตรงกลาง'}},
  {h:'รูปทรงของ Profile',b:`<ul><li><b>D</b>: balance ทั้งสองฝั่งพอกัน</li><li><b>P</b>: POC อยู่ด้านบน มักเกิดจาก <b>short covering</b> (ผู้ขายเก่าปิดสถานะ) ไม่ใช่ผู้ซื้อระยะยาวใหม่เสมอไป</li><li><b>b</b>: POC อยู่ด้านล่าง มักเกิดจาก <b>long liquidation</b></li><li><b>ผอมยาว</b>: trend ไม่มีเวลาสร้าง value</li></ul>`,
   demo:{kind:'pShape',seed:215,d:1,show:{...hide,vp:true,va:true},cap:'P-shape: วิ่งขึ้นเร็วช่วงเช้า แล้ว balance ด้านบน'}},
 ],
 drill:s=>{const R=mulberry32(s);const qs=[];const VPS={...hide,vp:true};
  for(let k=0;k<2;k++){const S=makeSession(pick(R,['normal','normalVar','neutral']),s+k*13);const P=prof(S);qs.push(clickQ('คลิกที่ราคา <b>POC</b> (ระดับที่มี volume มากที่สุด)',S,{p:P.poc},{show:VPS,ex:`POC อยู่ที่ <b>${P.poc}</b> คือแท่ง histogram ที่ยาวที่สุด`}))}
  {const S=makeSession('normalVar',s+71);const P=prof(S);qs.push(clickQ('คลิกที่ <b>VAH</b> (ขอบบนของช่วงที่รวม 70% ของ volume)',S,{p:P.vah},{show:VPS,lenient:true,ex:`VAH = <b>${P.vah}</b> ลองนึกภาพ: ตัด histogram ส่วนที่บางด้านบนและด้านล่างออก ให้เหลือก้อนกลางราว 70%`}))}
  {const S=makeSession('normal',s+72);const P=prof(S);qs.push(clickQ('คลิกที่ <b>VAL</b> (ขอบล่างของ Value Area)',S,{p:P.val},{show:VPS,lenient:true,ex:`VAL = <b>${P.val}</b>`}))}
  {let S,z;for(let k=0;k<6&&!z;k++){S=makeSession('double',s+80+k);z=lvnZone(prof(S))}if(z)qs.push(clickQ('คลิกในโซน <b>LVN</b> ที่คั่นระหว่างสองก้อน volume',S,{zone:[z.a,z.b]},{show:VPS,ex:`LVN อยู่ช่วง <b>${z.a}–${z.b}</b> ราคาวิ่งผ่านโซนนี้เร็วจึงมี volume น้อย`}))}
  const SH=['D — balance','P — POC ด้านบน (มักเป็น short covering)','b — POC ด้านล่าง (มักเป็น long liquidation)','ผอมยาว — trend'];
  for(let k=0;k<2;k++){const kd=pick(R,['pShape','pShape','normal','trend']);const S=makeSession(kd,s+90+k);const sh=shape(S);
   qs.push(mcq('Volume profile ของวันนี้เป็นรูปทรงไหน?',SH,{D:0,P:1,b:2,thin:3}[sh],{D:'POC อยู่กลางกรอบ volume กระจายสองฝั่งพอกัน',P:'ราคาวิ่งขึ้นเร็วแล้วไปสร้าง value ด้านบน ถ้าเกิดหลังขาลงมักเป็นการปิด short',b:'ราคาไหลลงเร็วแล้วสร้าง value ด้านล่าง มักเป็นการขายของคนที่ถือ long',thin:'ไม่มีจุดไหนที่ volume กองหนา ราคาเคลื่อนทางเดียวทั้งวัน'}[sh],{sess:S,n:NB,show:{...VPS,va:true}}))}
  qs.push(mcq('ราคาไหลจาก HVN ลงมาถึง LVN แล้วทะลุผ่านลงไปได้ เป้าหมายถัดไปที่สมเหตุสมผลคือ?',['HVN ถัดไปด้านล่าง','กลับไป POC เดิมทันที','LVN ถัดไปด้านล่าง','ไม่มีเป้าหมาย'],0,'ราคาวิ่งผ่าน LVN เร็ว แล้วไปชะลอที่บริเวณที่ตลาดเคยยอมรับ คือ HVN ถัดไป'));
  qs.push(mcq('Value Area มาตรฐานครอบคลุม volume กี่ %?',['70%','50%','90%','100%'],0,'70% ใกล้เคียงหนึ่งส่วนเบี่ยงเบนมาตรฐานของการกระจายปกติ'));
  qs.push(mcq('Profile รูป P หลังจากราคาวิ่งขึ้นเร็วในช่วงเช้า มักบอกอะไร?',['อาจเป็น short covering ไม่ใช่ผู้ซื้อระยะยาวใหม่เสมอไป','ผู้ซื้อระยะยาวเข้ามาแน่นอน','ตลาดจะขึ้นต่อทุกวัน','ราคาจะลงทันที'],0,'การวิ่งขึ้นที่ขับเคลื่อนด้วยการปิด short มักไม่มีแรงซื้อใหม่ต่อเนื่อง ต้องดูว่าวันถัดไปมีการยอมรับราคาสูงขึ้นหรือไม่'));
  return qs}},
{id:'tpo',title:'TPO / Market Profile',en:'IB · Single prints · Day types',blurb:'อ่านเวลา อ่านรอยเท้า OTF และประเภทของวัน',
 lessons:[
  {h:'TPO คืออะไร',b:`<p><b>Time Price Opportunity</b>: แบ่งวันเป็นช่วงละ 30 นาที ช่วงแรกคือ A ต่อมา B, C, … ทุกราคาที่ถูกเทรดในช่วงนั้นได้ตัวอักษรของช่วงนั้น 1 ตัว แล้วเรียงชิดซ้าย</p><p>ผลลัพธ์คือรูปทรงที่บอกว่าตลาด <b>ใช้เวลา</b> ที่ราคาไหนมากที่สุด</p><div class="key">ในเกมนี้: 13 ช่วง A–M (09:30–16:00), 1 แถว = 1 จุด</div><p class="tip">ตัวอักษรใต้แท่งเทียนบอกว่าแต่ละกลุ่ม 6 แท่งคือช่วงไหน</p>`,
   demo:{kind:'normal',seed:311,show:{...hide,tpo:true},cap:'ตัวอักษรด้านขวา = TPO profile ของวันนี้'}},
  {h:'Initial Balance (IB)',b:`<p><b>IB</b> คือช่วงราคาของ A + B (ชั่วโมงแรก)</p><ul><li>IB <b>กว้าง</b> → day timeframe สำรวจไปมากแล้ว มักเป็นวัน balance</li><li>IB <b>แคบ</b> → เสี่ยงต่อการขยายกรอบหรือวันเทรนด์</li></ul><p><b>Range extension</b> คือราคาออกนอก IB เป็นสัญญาณว่า OTF เข้ามา</p>`,
   demo:{kind:'normalVar',seed:312,show:{...hide,tpo:true,ib:true},cap:'เส้นสีม่วง = IB High / IB Low'}},
  {h:'Single Prints',b:`<p>แถวที่มีตัวอักษรเพียงตัวเดียว <b>กลางโปรไฟล์</b> แปลว่าราคาวิ่งผ่านเร็วเพราะฝั่งหนึ่งครอบงำ (imbalance)</p><ul><li>เมื่อราคากลับมาทดสอบ single prints มักเป็นแนวรับ/ต้าน</li><li>ถ้าราคากลับเข้าไปเทรดซ้ำจนเติมเต็ม แปลว่าแรงนั้นหมดแล้ว</li></ul>`,
   demo:{kind:'double',seed:313,show:{...hide,tpo:true,singles:true},cap:'แถบไฮไลต์ = single prints'}},
  {h:'Excess vs Poor High/Low',b:`<ul><li><b>Excess (tail)</b>: single prints ≥ 2 แถวที่ปลายสุด แปลว่าการประมูลจบสมบูรณ์ ฝั่งตรงข้ามตอบโต้แรง ระดับนั้นแข็งแรง</li><li><b>Poor high/low</b>: ปลายแบน มี ≥ 2 ตัวอักษรที่ราคาสูง/ต่ำสุดเดียวกัน แปลว่าการประมูลยังไม่จบ ราคามักกลับมาทดสอบในวันถัดๆ ไป จึงใช้เป็นเป้าหมายได้</li></ul>`,
   demo:{kind:'normal',seed:314,show:{...hide,tpo:true},cap:'ดูปลายบนและปลายล่างของ profile'}},
  {h:'ประเภทของวัน (Day Types)',b:`<p>เกณฑ์ที่ใช้ในเกมนี้ (วัดการขยายกรอบเทียบกับความกว้าง IB):</p><ul><li><b>Normal</b>: ขยายจาก IB น้อยกว่า 0.2×IB</li><li><b>Normal Variation</b>: ขยายด้านเดียว 0.2–1.5×IB</li><li><b>Trend</b>: ขยายด้านเดียว ≥ 1.5×IB และปิดใกล้ปลาย</li><li><b>Neutral</b>: ขยายออกทั้งสองด้าน</li><li><b>Double Distribution</b>: สองกลุ่ม value แยกด้วย single prints</li></ul><p>Normal/Neutral → fade ขอบ · Trend → ตามเทรนด์ ห้ามสวน · Double → single prints เป็นแนว</p>`,
   demo:{kind:'neutral',seed:315,show:{...hide,tpo:true,ib:true},cap:'Neutral day: ขยายออกนอก IB ทั้งสองด้าน'}},
  {h:'TPO กับ Volume Profile ใช้ร่วมกัน',b:`<p>TPO นับ <b>เวลา</b> Volume Profile นับ <b>ปริมาณ</b> ส่วนใหญ่สองอย่างนี้ให้ภาพคล้ายกัน</p><p>เมื่อต่างกัน เช่น TPO POC กับ VP POC อยู่คนละที่ แปลว่ามีการซื้อขายหนาแน่นในเวลาสั้นๆ (เช่น ช่วงข่าว) ใช้ทั้งสองยืนยันกันเสมอ</p>`,
   demo:{kind:'pShape',seed:316,d:-1,toggles:true,show:{...hide,tpo:true,vp:true,va:true},cap:'เปิดทั้ง TPO และ VP เพื่อเทียบกัน'}},
 ],
 drill:s=>{const R=mulberry32(s);const qs=[];const TP={...hide,tpo:true};
  {const S=makeSession('normalVar',s+5);const P=prof(S);const hiSide=R()<.5;const t=hiSide?Math.floor(P.ibh+1e-9):Math.ceil(P.ibl-1e-9);
   qs.push(clickQ(`คลิกที่ <b>${hiSide?'IB High':'IB Low'}</b> (ราคา${hiSide?'สูง':'ต่ำ'}สุดของช่วง A และ B)`,S,{p:t},{show:TP,ex:`${hiSide?'IB High':'IB Low'} = <b>${t}</b> ดูเฉพาะแถวที่มีตัวอักษร A หรือ B`,after:{show:{...TP,ib:true}}}))}
  {let S,run;for(let k=0;k<6&&!run;k++){S=makeSession('double',s+20+k);const m=prof(S).singles.filter(x=>!x.top&&!x.bot&&x.b-x.a>=2);if(m.length)run=m.reduce((a,b)=>b.b-b.a>a.b-a.a?b:a)}
   if(run)qs.push(clickQ('คลิกในโซน <b>single prints</b> (แถวที่มีตัวอักษรเดียว กลางโปรไฟล์)',S,{zone:[run.a,run.b]},{show:TP,ex:`Single prints อยู่ช่วง <b>${run.a}–${run.b}</b> ราคาวิ่งผ่านในช่วงเวลาเดียว`,after:{show:{...TP,singles:true}}}))}
  const types=['normal','normalVar','trend','neutral','double'];
  for(const kd of shuffle(types).slice(0,3)){const S=makeSession(kd,s+40+types.indexOf(kd));const ty=classify(S);const P=prof(S);const IB=P.ibh-P.ibl;
   qs.push(mcq('วันนี้เป็นวันประเภทไหน? (ดู TPO และเส้น IB)',types.map(t=>DTN[t]),types.indexOf(ty),`${DTN[ty]}: ${DTX[ty]}<br><span class="mono" style="color:var(--muted)">IB ${f1(IB)} จุด · ขยายบน ${f1(Math.max(0,P.hi-P.ibh))} · ขยายล่าง ${f1(Math.max(0,P.ibl-P.lo))}</span>`,{sess:S,n:NB,show:{...TP,ib:true}}))}
  {let q=null;for(let k=0;k<30&&!q;k++){const S=makeSession(pick(R,['normal','normalVar','neutral']),s+60+k);const P=prof(S);
    const tT=P.singles.find(x=>x.top&&x.b-x.a>=1),tB=P.singles.find(x=>x.bot&&x.b-x.a>=1),pH=P.tp[P.len-1].length>=2,pL=P.tp[0].length>=2;
    const side=R()<.5?'hi':'lo';const tail=side==='hi'?tT:tB,poor=side==='hi'?pH:pL;if(!tail&&!poor)continue;const w=side==='hi'?'high':'low';
    q=mcq(`ปลาย${side==='hi'?'บน':'ล่าง'} (${w}) ของวันนี้เป็นแบบไหน?`,[`Excess / tail: มี single prints ≥ 2 แถวที่ปลาย`,`Poor ${w}: ปลายแบน มีหลายตัวอักษรที่ราคาเดียวกัน`],tail?0:1,tail?'ปลายมี single prints ยื่นออกไป การประมูลจบแล้ว ระดับนี้แข็งแรง':`ปลายแบนเพราะหลายช่วงเวลาไปหยุดที่ราคาเดียวกัน การประมูลยังไม่จบ ราคามีแนวโน้มกลับมาทดสอบ ${w} นี้`,{sess:S,n:NB,show:TP})}
   if(q)qs.push(q)}
  qs.push(mcq('IB วันนี้แคบมากเมื่อเทียบกับปกติ ควรเตรียมใจอย่างไร?',['เสี่ยงต่อการขยายกรอบหรือวันเทรนด์ เตรียมเทรดตาม breakout ที่มี acceptance','วันนี้จะเงียบแน่นอน','fade ทุก breakout','ไม่สำคัญ'],0,'IB แคบแปลว่า day timeframe ยังสำรวจราคาได้น้อย เมื่อ OTF เข้ามามักขยายกรอบได้ไกล'));
  qs.push(mcq('เมื่อวานจบด้วย poor low (ปลายล่างแบน) ข้อใดถูก?',['การประมูลด้านล่างยังไม่จบ ราคามักกลับมาทดสอบ ใช้เป็นเป้าของฝั่ง short ได้','เป็นแนวรับที่แข็งแรงที่สุด','ห้ามเทรดวันนี้','แปลว่าวันนี้จะเป็นวันเทรนด์ขึ้น'],0,'Poor low ไม่มี excess ยืนยัน จึงเป็นระดับที่อ่อนแอและเป็นเป้าหมายตามธรรมชาติ'));
  return qs}},
{id:'open',title:'การเปิดตลาดและบริบท',en:'Open location · Open types',blurb:'30–60 นาทีแรกบอกความมั่นใจของวัน',
 lessons:[
  {h:'เทียบการเปิดกับ value เมื่อวาน',b:`<ul><li><b>เปิดใน VA เมื่อวาน</b> → ตลาดยอมรับ value เดิม คาด rotation ในกรอบ</li><li><b>เปิดนอก VA แต่ในกรอบเมื่อวาน</b> → ความมั่นใจปานกลาง ดูว่าจะกลับเข้า VA (80% rule) หรือไม่</li><li><b>เปิดนอกกรอบเมื่อวาน (gap)</b> → imbalance สูง ถ้าไม่ถูกปฏิเสธเร็ว มีโอกาสเป็นวันเทรนด์</li></ul><p class="tip">เส้นประสีทอง = pVAH / pVAL / pPOC ของเมื่อวาน เส้นประสีเทา = high/low เมื่อวาน</p>`,
   demo:{kind:'gapGo',seed:411,d:1,show:{...hide,prior:true},cap:'Gap เหนือ high เมื่อวาน'}},
  {h:'Open Drive (OD)',b:`<p>เปิดแล้ววิ่งทันทีทางเดียว <b>ไม่กลับมาที่ราคาเปิด</b> OTF เข้าตั้งแต่ระฆังแรก</p><p>ความมั่นใจสูงที่สุดในสี่แบบ อย่าสวน ให้หาจังหวะเข้าตามตอนย่อ</p>`,
   demo:{kind:'OD',seed:412,d:1,n:18,show:{...hide,tpo:true,prior:true},cap:'90 นาทีแรกของ Open Drive'}},
  {h:'Open Test Drive (OTD)',b:`<p>เปิดแล้วไป <b>ทดสอบ</b> ด้านหนึ่งสั้นๆ (มักเป็นแนวสำคัญ) ไม่มีใครตอบรับ จึงกลับตัวแรงและ drive ทะลุราคาเปิดไปอีกทาง</p><p>ความมั่นใจรองจาก OD จุดที่ทดสอบมักกลายเป็นแนว</p>`,
   demo:{kind:'OTD',seed:413,d:1,n:18,show:{...hide,tpo:true,prior:true},cap:'ทดสอบลงสั้นๆ แล้ว drive ขึ้น'}},
  {h:'Open Rejection Reverse (ORR)',b:`<p>เปิดแล้ววิ่งไปทางหนึ่ง <b>นานกว่าและไกลกว่า</b> OTD เจอแรงตอบโต้ แล้วกลับทะลุราคาเปิดไปอีกด้าน แต่แกว่งมากกว่า</p><p>ความมั่นใจปานกลาง ต่างจาก OTD ที่ <b>เวลา</b> และ <b>ความเด็ดขาด</b> ของการกลับตัว</p>`,
   demo:{kind:'ORR',seed:414,d:1,n:18,show:{...hide,tpo:true,prior:true},cap:'วิ่งขึ้นก่อน ถูกปฏิเสธ แล้วกลับลงทะลุราคาเปิด'}},
  {h:'Open Auction (OA)',b:`<p>เปิดแล้วแกว่งขึ้นลงรอบราคาเปิด ไม่มีใครคุม ความมั่นใจต่ำ</p><p>คาดวัน balance: รอ IB ก่อตัว แล้ว fade ขอบ หรือรอ breakout ที่มี acceptance</p>`,
   demo:{kind:'OA',seed:415,n:18,show:{...hide,tpo:true,prior:true},cap:'ราคาข้ามไปมารอบราคาเปิด'}},
  {h:'แผนก่อนเปิดตลาด',b:`<p>ทำทุกเช้าก่อนกดปุ่มใดๆ:</p><ul><li>มาร์ก pVAH / pVAL / pPOC, high/low เมื่อวาน</li><li>มาร์ก poor high/low, single prints, naked POC</li><li>เขียนสถานการณ์ “ถ้า…แล้ว…” อย่างน้อยสองแบบ เช่น “ถ้าเปิดใต้ VAL แล้วกลับเข้ามา 2 TPO → long ไป VAH”</li><li>ดู 30–60 นาทีแรกเพื่อยืนยัน open type ก่อนเพิ่มขนาด</li></ul>`},
 ],
 drill:s=>{const R=mulberry32(s);const qs=[];const ot=['OD','OTD','ORR','OA'];
  for(const k of shuffle(ot)){const S=makeSession(k,s+ot.indexOf(k)*17);
   qs.push(mcq('ดู 90 นาทีแรก (A–C) นี่คือ open type แบบไหน?',ot.map(t=>OTN[t]),ot.indexOf(k),{OD:'วิ่งทางเดียวตั้งแต่เปิด ไม่กลับมาที่ราคาเปิดเลย',OTD:'ทดสอบสวนทางสั้นๆ ไม่กี่แท่ง แล้ว drive กลับทะลุราคาเปิดอย่างเด็ดขาด',ORR:'วิ่งไปทางหนึ่งนานและไกลกว่า แล้วถูกปฏิเสธกลับทะลุราคาเปิดแบบแกว่งๆ',OA:'แกว่งข้ามราคาเปิดไปมา ไม่มีฝั่งไหนคุม'}[k]+' — ดูส่วนที่เหลือของวันบนกราฟ',{sess:S,n:18,show:{...hide,tpo:true,prior:true},reveal:true}))}
  for(let k=0;k<2;k++){const loc=pick(R,['inVA','aboveVA','belowVA','gapUp','gapDown']);const S=makeSession('OA',s+50+k,{loc});const L=openLoc(S);const a=L==='inVA'?0:L.includes('VA')?1:2;
   qs.push(mcq('ราคาเปิดวันนี้ (แท่งแรก) อยู่ตรงไหนเทียบกับเมื่อวาน?',['ใน Value Area เมื่อวาน','นอก VA แต่ยังอยู่ในกรอบเมื่อวาน','นอกกรอบเมื่อวาน (gap)'],a,['เปิดใน VA → ตลาดยอมรับ value เดิม คาด rotation แผนหลักคือ fade ขอบ VA/IB','เปิดนอก VA แต่ในกรอบ → ความมั่นใจปานกลาง ถ้ากลับเข้า VA และอยู่ได้ 2 TPO ให้นึกถึง 80% rule','เปิดนอกกรอบ → imbalance สูง ระวังการสวน ถ้า 30–60 นาทีแรกไม่ถูกปฏิเสธ มีโอกาสวิ่งไปทาง gap'][a],{sess:S,n:2,show:{...hide,prior:true}}))}
  qs.push(mcq('วันนี้เปิดแบบ Open Drive ขาลง แผนไหนเหมาะที่สุด?',['หาจังหวะ short ตอนราคาย่อขึ้น stop เหนือราคาเปิด ห้ามสวน','Long เพราะราคาลงมาเยอะแล้ว','รอ IB เสร็จแล้ว fade ขอบล่าง','ไม่ต้องมีแผน'],0,'Open Drive คือความมั่นใจสูงสุดของ OTF การสวนคือการยืนขวางรถไฟ'));
  qs.push(mcq('เปิดใน VA เมื่อวานแบบ Open Auction ความคาดหวังหลักคือ?',['วัน balance: รอ IB แล้ว fade ขอบ หรือรอ breakout ที่มี acceptance','วันเทรนด์แรง','gap จะปิดทันที','ราคาจะไม่เคลื่อนเลย'],0,'ทั้งตำแหน่งเปิดและ open type บอกว่าไม่มีใครเร่ง ความน่าจะเป็นจึงอยู่ข้าง rotation'));
  return qs}},
{id:'setup',title:'Setups ที่ใช้เทรดจริง',en:'80% rule · Fade · Pullback',blurb:'รวมทุกอย่างเป็นแผนเข้า–ออกที่มีเหตุผล',
 lessons:[
  {h:'80% Rule',b:`<p><b>เงื่อนไข</b>: เปิดนอก VA เมื่อวาน แล้วกลับเข้ามาและอยู่ใน VA ได้ <b>2 ช่วง TPO ติดกัน</b></p><div class="key">Entry : หลังช่วงที่ 2 ปิดใน VA
Stop  : นอกขอบ VA ที่ราคาเพิ่งกลับเข้ามา
Target: ขอบ VA อีกฝั่ง</div><p>ชื่อ 80% เป็นชื่อเรียก ไม่ใช่อัตราชนะที่รับประกัน</p>`,
   demo:{kind:'eighty',seed:511,d:1,show:{...hide,prior:true,tpo:true},cap:'เปิดใต้ pVAL → กลับเข้ามา → เดินไป pVAH'}},
  {h:'Value Area Edge Fade',b:`<p><b>เงื่อนไข</b>: เปิดใน VA (วัน balance) ราคาไปทดสอบ VAH/VAL แล้ว <b>ถูกปฏิเสธ</b> กลับเข้ามาเร็ว</p><div class="key">Entry : เมื่อราคากลับเข้า VA
Stop  : เลย high/low ที่ถูกปฏิเสธ + buffer
Target: POC</div>`,
   demo:{kind:'vaFade',seed:512,d:1,show:{...hide,prior:true,tpo:true},cap:'ทะลุ pVAH ชั่วครู่แล้วกลับหา pPOC'}},
  {h:'Look Above / Below and Fail',b:`<p>ราคาทะลุ IB หรือขอบ VA ได้นิดเดียว ไม่มี volume ไม่มีเวลา แล้วกลับเข้ากรอบ แปลว่าไม่มีใครต้องการราคานั้น ผู้ที่ไล่ breakout ติดอยู่ผิดฝั่ง</p><div class="key">Entry : เมื่อกลับเข้ากรอบ
Stop  : เลยจุดที่ fail
Target: กลาง IB / POC / ขอบตรงข้าม</div>`,
   demo:{kind:'failBO',seed:513,d:1,show:{...hide,tpo:true,ib:true},cap:'ทะลุ IB High แล้วล้มเหลว'}},
  {h:'Breakout + Acceptance',b:`<p>ตรงข้ามกับข้อที่แล้ว: ราคาออกนอก IB/VA แล้ว <b>อยู่ได้</b> อย่างน้อย 2 ช่วง TPO และสร้าง volume ที่ราคาใหม่</p><p>เข้าตามทิศเมื่อราคาย่อกลับมาทดสอบขอบที่ทะลุ (ขอบเก่ากลายเป็นแนวรับ) stop กลับเข้าไปในกรอบเดิม</p>`,
   demo:{kind:'normalVar',seed:514,d:1,show:{...hide,tpo:true,ib:true},cap:'ขยายกรอบเหนือ IB และอยู่ได้'}},
  {h:'VWAP Pullback ในวันเทรนด์',b:`<p>วันที่เปิดแบบ drive ราคาอยู่ฝั่งเดียวของ VWAP มาตลอด เมื่อย่อมาแตะ VWAP (หรือ 1σ) แล้วเริ่มกลับ คือจุดเข้าตามเทรนด์</p><div class="key">Entry : เมื่อราคาเด้งจาก VWAP
Stop  : เลย swing ล่าสุด / อีกฝั่งของ VWAP
Target: high/low ใหม่ของวัน หรือถือตาม trail</div>`,
   demo:{kind:'trendPull',seed:515,d:1,show:{...hide,vwap:true,bands:true},cap:'ย่อมาแตะ VWAP แล้วไปต่อ'}},
  {h:'Single Prints / LVN Retest',b:`<p>ราคาย้อนกลับมาที่ single prints หรือ LVN ที่เพิ่งเกิด ถ้าระดับนั้นยังมีคนปกป้อง ราคาจะเด้งกลับ</p><ul><li>เข้าใกล้ขอบโซน stop เลยกลางโซน</li><li>ถ้าราคาเข้าไปเติมจนเต็มและอยู่ได้ แปลว่าแรงนั้นหมด ไอเดียผิด</li></ul><p class="tip">ทุก setup มีโอกาสผิด setup ให้ edge ไม่ใช่ความแน่นอน stop คือราคาของการรู้ว่าตัวเองผิด</p>`,
   demo:{kind:'ddRetest',seed:516,d:1,show:{...hide,tpo:true,singles:true},cap:'ย้อนมาทดสอบ single prints ช่วงบ่าย'}},
 ],
 drill:s=>{const ks=shuffle(['eighty','vaFade','failBO','trendPull','ddRetest','gapGo']).slice(0,5);
  return ks.map((k,i)=>{let S;for(let t=0;t<5;t++){S=makeSession(k,s+i*101+t*7);if(S.ok)break}return scenarioQ(k,S)})}},
{id:'risk',title:'ความเสี่ยงและวินัย',en:'R · Sizing · Expectancy',blurb:'ส่วนที่ทำให้อยู่รอดในตลาดจริง',
 lessons:[
  {h:'R คือหน่วยของคุณ',b:`<p><b>1R</b> = จำนวนเงินที่ยอมเสียต่อหนึ่งไม้ วัดผลเป็น R ไม่ใช่เป็นบาท เพื่อให้เปรียบเทียบได้ทุกขนาดบัญชี</p><div class="key">R ที่ได้ = (ราคาออก − ราคาเข้า) ÷ (ราคาเข้า − stop)   [สำหรับ long]</div><p>เทรดเดอร์ที่ทำกำไรระยะยาว ส่วนใหญ่ชนะไม่ถึง 60% แต่ได้มากกว่าเสียเมื่อชนะ</p>`},
  {h:'วาง stop ตรงที่ไอเดียผิด',b:`<p>Stop ต้องอยู่ <b>นอกโครงสร้าง</b>: เลย high ที่ถูกปฏิเสธ, อีกฝั่งของ VA, ใต้ VWAP/swing low</p><p>วาง stop ตามโครงสร้างก่อน แล้วค่อย <b>คำนวณขนาดสัญญา</b> ให้ความเสี่ยงเท่า 1R อย่าทำกลับกัน (เอาเงินที่อยากเสียมากำหนด stop) เพราะ stop จะไปอยู่กลาง noise</p>`},
  {h:'ขนาดสถานะ',b:`<div class="key">สัญญา = เงินที่เสี่ยง ÷ (ระยะ stop × มูลค่าต่อจุด)

ตัวอย่าง: บัญชี 100,000 บาท เสี่ยง 1% = 1,000 บาท
stop 2.5 จุด, 1 จุด = 200 บาท
→ 1,000 ÷ (2.5 × 200) = 2 สัญญา</div><p>ปัดลงเสมอ ถ้าคำนวณได้น้อยกว่า 1 สัญญา แปลว่าเทรดนั้นใหญ่เกินบัญชี ให้ข้าม</p>`},
  {h:'Expectancy',b:`<div class="key">E = (Win% × กำไรเฉลี่ย R) − (Loss% × ขาดทุนเฉลี่ย R)

ชนะ 40%, กำไรเฉลี่ย 2.5R, ขาดทุน 1R
E = 0.4×2.5 − 0.6×1 = +0.4R ต่อไม้</div><p>100 ไม้ × 0.4R × 1,000 บาท = +40,000 บาท แม้จะแพ้ 60 ไม้</p>`},
  {h:'กฎของวัน',b:`<ul><li><b>Daily loss limit</b>: เช่น −3R แล้วหยุด</li><li><b>จำนวนไม้สูงสุด</b>: เช่น 4 ไม้ต่อวัน</li><li><b>ห้าม revenge trade</b>: เข้าซ้ำทันทีหลังขาดทุนเพื่อเอาคืน</li><li><b>Journal</b>: จด setup, บริบท, ผล และทำตามแผนหรือไม่ ทุกไม้</li></ul><p>ใน Arena ระบบจะให้คะแนนวินัยตามกฎเหล่านี้</p>`},
  {h:'เส้นทางสู่ตลาดจริง',b:`<ul><li>ผ่าน Arena จนได้ยศ <b>Hero</b></li><li>Paper trade ด้วยข้อมูลจริงบนแพลตฟอร์มที่มี TPO / Volume Profile / VWAP อย่างน้อย 20 วันทำการ</li><li>เริ่มเงินจริงด้วยสัญญาขนาดเล็กที่สุด เสี่ยง ≤ 0.5% ต่อไม้</li><li>เพิ่มขนาดเมื่อมีอย่างน้อย 50 ไม้ที่ expectancy เป็นบวกและทำตามแผน</li></ul><p class="tip">ข้อมูลในเกมเป็นข้อมูลจำลอง ตลาดจริงมี slippage, ข่าว, gap ข้ามคืน และสภาพคล่องที่เปลี่ยนไป เนื้อหานี้เพื่อการศึกษา ไม่ใช่คำแนะนำการลงทุน</p>`},
 ],
 drill:s=>{const R=mulberry32(s);const qs=[];
  for(let k=0;k<2;k++){let acct,risk,st,a;do{acct=pick(R,[100000,200000,500000]);risk=pick(R,[.5,1,2]);st=pick(R,[1.5,2,2.5,3,4,5]);a=Math.floor(acct*risk/100/(st*PV))}while(a<1);const e=900+Math.round(R()*200);
   qs.push({type:'num',q:`บัญชี ${fmt(acct)} บาท เสี่ยงต่อไม้ ${risk}% · Long ที่ ${e} stop ที่ ${f1(e-st)} (ห่าง ${st} จุด) · 1 จุด = 200 บาท<br>ควรเทรดกี่สัญญา? (ปัดลง)`,a,tol:0,unit:'สัญญา',ex:`${fmt(acct*risk/100)} ÷ (${st} × 200) = ${(acct*risk/100/(st*PV)).toFixed(2)} → ปัดลง <b>${a} สัญญา</b>`})}
  {const e=900+Math.round(R()*200),st=pick(R,[2,2.5,3,4]),rt=pick(R,[-1,.5,1.5,2,2.5,3]);const xP=r1(e+st*rt);
   qs.push({type:'num',q:`Long ที่ ${e} stop ${f1(e-st)} แล้วปิดที่ ${f1(xP)} ไม้นี้ได้กี่ R?`,a:rt,tol:.06,unit:'R',ex:`(${f1(xP)} − ${e}) ÷ (${e} − ${f1(e-st)}) = <b>${rt}R</b>`})}
  {const w=pick(R,[35,40,45,50,55]),aw=pick(R,[1.5,2,2.5,3]);const a=+(w/100*aw-(1-w/100)).toFixed(3);
   qs.push({type:'num',q:`ระบบชนะ ${w}% กำไรเฉลี่ย ${aw}R ขาดทุนเฉลี่ย 1R · Expectancy ต่อไม้เท่ากับกี่ R?`,a,tol:.021,unit:'R',ex:`${w/100}×${aw} − ${(1-w/100).toFixed(2)}×1 = <b>${a.toFixed(2)}R</b> ${a>0?'(ระบบมี edge)':'(ระบบไม่มี edge)'}`})}
  qs.push(mcq('ควรกำหนดจุด stop loss อย่างไร?',['ที่ระดับที่ไอเดียผิด (นอกโครงสร้าง) แล้วคำนวณขนาดสัญญาให้เสี่ยงเท่า 1R','ตามจำนวนเงินที่อยากเสีย ไม่สนโครงสร้าง','ไม่ต้องตั้ง ค่อยตัดสินใจทีหลัง','ใกล้ที่สุดเท่าที่ทำได้เสมอ'],0,'Stop ที่อยู่กลาง noise จะโดนบ่อยแม้ไอเดียถูก ให้โครงสร้างเป็นตัวกำหนด stop และให้ขนาดสัญญาเป็นตัวคุมเงิน'));
  qs.push(mcq('ขาดทุนติดกัน 3 ไม้ ถึง daily loss limit −3R แล้ว ควรทำอะไร?',['หยุดเทรดวันนี้ จดบันทึก แล้วทบทวน','เพิ่มขนาดเพื่อเอาคืน','เปลี่ยนไปเทรดสวนทุกสัญญาณ','ย้าย stop ให้ไกลขึ้น'],0,'Loss limit มีไว้ปกป้องคุณจากการตัดสินใจตอนอารมณ์ไม่ปกติ'));
  qs.push(mcq('Setup ที่ถูกต้องตามตำรา แต่ไม้นั้นโดน stop ข้อใดถูก?',['ถ้าทำตามแผนและขนาดถูกต้อง นี่คือการเทรดที่ดี ผลลัพธ์รายไม้เป็นเรื่องความน่าจะเป็น','แปลว่า setup ใช้ไม่ได้ ต้องเลิกใช้','ควรเลื่อน stop ออกไปตั้งแต่แรก','ควร martingale ไม้ถัดไป'],0,'ตัดสินคุณภาพการเทรดจากกระบวนการ ไม่ใช่จากผลไม้เดียว ประเมิน setup จากตัวอย่างอย่างน้อย 30–50 ไม้'));
  return qs}},
{id:'adv',title:'อ่าน Profile ขั้นสูง',en:'Mind Over Markets toolkit',blurb:'TPO count · rotation factor · initiative/responsive · ledge · overnight inventory · การวาง value · bracket/trend',
 lessons:[
  {h:'TPO Count: ใครได้เปรียบใน value',b:`<p>ในวันที่ไม่มี tail หรือ range extension ชัดๆ การต่อสู้เกิดขึ้นเงียบๆ <b>ภายใน value area</b> TPO count ใช้วัดว่าใครกำลังได้เปรียบ</p><div class="key">1) หา POC ของ TPO (แถวที่ยาวที่สุด ถ้าเท่ากันเลือกแถวที่ใกล้กลางกรอบ)
2) นับ TPO ทั้งหมดเหนือ POC และใต้ POC
3) ไม่นับ single-print tail ที่ปลาย เพราะความหมายของมันชัดอยู่แล้ว</div><ul><li>TPO <b>เหนือ</b> POC = เวลาที่ผู้ขายยอมขายเหนือราคายุติธรรม</li><li>TPO <b>ใต้</b> POC = เวลาที่ผู้ซื้อยอมซื้อใต้ราคายุติธรรม</li></ul><p>ถ้า TPO ใต้ POC สะสมมากขึ้นแต่ราคาไม่ขยายกรอบลง แปลว่าแรงขายถูกดูดซับ <b>ผู้ซื้อได้เปรียบ</b> (กลับกันก็เช่นเดียวกัน) ความไม่สมดุลตอนปิดวันมักส่งแรงต่อไปถึงวันถัดไป</p><p class="tip">เป็นตัวชี้วัดที่ช้าและละเอียด ใช้ประกอบภาพรวม ไม่ใช่สัญญาณเข้าเทรดเดี่ยวๆ</p>`,
   demo:{kind:'normal',seed:811,show:{...hide,tpo:true},marks:(S,P)=>[{p:tpoPocOf(P),label:'TPO POC',col:C.brass}],capFn:(S,P)=>{const t=tpoCount(P);return`TPO count วันนี้: เหนือ POC <b>${t.up}</b> / ใต้ POC <b>${t.dn}</b> → ${t.dn>t.up*1.15?'ผู้ซื้อได้เปรียบ':t.up>t.dn*1.15?'ผู้ขายได้เปรียบ':'ใกล้สมดุล'}`}}},
  {h:'Rotation Factor: ตลาดพยายามไปทางไหน',b:`<p>วัด "ทิศที่ตลาด<b>พยายาม</b>ไป" แบบเป็นตัวเลข จาก high และ low ของแต่ละช่วง 30 นาที</p><div class="key">เทียบแต่ละช่วงกับช่วงก่อนหน้า
high สูงกว่า +1 · ต่ำกว่า −1 · เท่ากัน 0
low  สูงกว่า +1 · ต่ำกว่า −1 · เท่ากัน 0
รวมทุกช่วงของวัน = Rotation Factor (RF)</div><p>RF บวกมาก = ผู้ซื้อพยายามดันขึ้นต่อเนื่อง · ลบมาก = ผู้ขายพยายามกดลง · ใกล้ 0 = หมุนสองทาง</p><p class="tip">RF ตอบแค่ "พยายามไปทางไหน" ยังไม่ตอบว่า "ทำได้ดีไหม" ต้องดู volume, การย้ายของ value และ range extension ประกอบเสมอ</p>`,
   demo:{kind:'trend',seed:812,d:1,show:{...hide,tpo:true},capFn:(S)=>{const H=periodsHL(S,Math.ceil(S.nb/S.per));return`Rotation Factor ทั้งวัน = <b>${fsgn(rotFactor(H))}</b> (${H.length} ช่วง) ผู้ซื้อพยายามดันขึ้นแทบทุกช่วง`}}},
  {h:'Initiative vs Responsive',b:`<p>เทียบการซื้อขายวันนี้กับ <b>value area เมื่อวาน</b> ซึ่งเป็นราคาที่ตลาดยอมรับล่าสุด</p><ul><li><b>Initiative buying</b>: ซื้อใน/เหนือ VA เมื่อวาน ผู้ซื้อยอมจ่ายแพงกว่า value เพราะมั่นใจ</li><li><b>Initiative selling</b>: ขายใน/ใต้ VA เมื่อวาน</li><li><b>Responsive buying</b>: ซื้อเพราะราคาต่ำกว่า value (ของถูก)</li><li><b>Responsive selling</b>: ขายเพราะราคาสูงกว่า value (ของแพง)</li></ul><p>Initiative = ความเชื่อมั่นสูง value อาจกำลังย้าย · Responsive = ตลาดยังผูกกับ value เดิม การซื้อขายภายใน VA เมื่อวานนับเป็น initiative แต่น่าเชื่อถือน้อยกว่าที่เกิดนอก VA</p><p class="tip">เหตุการณ์เดียวกันมองได้สองด้าน เช่น tail ที่ราคาถูกซื้อกลับขึ้นมาจากใต้ VAL คือ responsive buying ซึ่งเกิดจาก initiative selling ที่ถูกปฏิเสธ</p>`,
   demo:{kind:'vaFade',seed:813,d:1,show:{...hide,prior:true,tpo:true},cap:'ราคาขึ้นไปเหนือ pVAH แล้วผู้ขายตอบโต้ = responsive selling'}},
  {h:'Ledge: หิ้งในโปรไฟล์',b:`<p><b>Ledge</b> คือจุดที่หลายช่วงเวลาไปหยุดที่ราคาเดียวกัน ขอบของตัวอักษรจึงตัดตรงเหมือนหิ้ง จำนวน TPO ของสองแถวติดกันต่างกันแบบกระโดด</p><ul><li>คล้าย poor high/low แต่เกิดกลางโปรไฟล์ได้ แปลว่าการประมูลที่ระดับนั้นยังไม่จบ</li><li>ตลาดมักกลับมาทดสอบ และเมื่อทะลุ ledge ได้ ราคามักวิ่งเร็ว เพราะอีกฝั่งแทบไม่มีการซื้อขาย</li></ul><div class="key">ในเกมนี้: ledge = ขอบที่จำนวน TPO ของแถวติดกันต่างกันตั้งแต่ 3 ตัวขึ้นไป (ไม่นับ 2 แถวปลายสุด)</div>`,
   demo:{kind:'pShape',seed:814,d:1,show:{...hide,tpo:true},marks:(S,P)=>{const g=findLedge(P);return g?[{p:g.r,label:'Ledge',col:C.ib}]:[]},cap:'เส้นสีม่วง = ขอบที่หลายช่วงเวลาหยุดพร้อมกัน'}},
  {h:'Overnight Inventory',b:`<p>ก่อนตลาดหลักเปิด ให้ดูว่าเทรดเดอร์ช่วงกลางคืน "ถือของ" ไปทางไหน โดยวัดเทียบกับ <b>ราคา settle</b> ของวันก่อน</p><div class="key">ทองคำ COMEX: settle ≈ 13:30 นิวยอร์ก (≈ 00:30 ไทย)
เวลาส่วนใหญ่ช่วงกลางคืนอยู่เหนือ settle → inventory long
ส่วนใหญ่อยู่ใต้ settle → inventory short
พอๆ กัน → neutral</div><ul><li>ช่วงกลางคืนมี volume น้อย ผู้เล่นเป็นมือสั้นที่ถือของไม่ทน</li><li>ถ้า inventory เอียงไปทางเดียวมาก มักมี <b>การปรับ inventory</b> หลังตลาดหลักเปิด เช่น long ถูกขายออก</li><li>ถ้า inventory long แล้วตลาดไม่ปรับลง แปลว่าตลาดแข็งอย่างน้อยในระยะสั้น</li></ul><p class="tip">ในเกม ช่วง "กลางคืน" ของทองจริงคือ 18:00–08:20 นิวยอร์ก (ช่วงเอเชีย + ลอนดอน) ตลาดหลักคือช่วงนิวยอร์ก</p>`,
   demo:{make:()=>{if(!HAS_REAL)return null;for(let k=REAL.sessions.length-1;k>1;k--){const o=onInventory(k);if(o&&o.inv!=='neutral')return{S:o.S,n:o.nyS,o}}return null},show:{...hide,vwap:false},marks:(S,P,m)=>[{p:m.o.settle,label:'Settle เมื่อวาน',col:C.brass}],
     capFn:(S,P,m)=>`ทองจริง ${S.date}: ช่วงกลางคืน ${Math.round(m.o.frac*100)}% ของแท่งปิดเหนือ settle → inventory <b>${m.o.inv}</b> · หลังนิวยอร์กเปิด 1 ชม. ราคา${m.o.c1>m.o.o?'ขึ้น':'ลง'} ${f1(Math.abs(m.o.c1-m.o.o))}`}},
  {h:'การวาง Value Area วันต่อวัน',b:`<p>เทียบ value area วันนี้กับเมื่อวาน เพื่อดูว่าตลาดยอมรับราคาไปทางไหน</p><ul><li><b>สูงขึ้น</b> (ไม่ซ้อนกัน): ผู้ซื้อชนะชัด</li><li><b>ซ้อนทับ-สูงขึ้น</b>: เอียงไปทางผู้ซื้อ แต่ยังไม่เด็ดขาด</li><li><b>ซ้อนทับ / ไม่เปลี่ยน</b>: balance</li><li><b>ซ้อนทับ-ต่ำลง</b> และ <b>ต่ำลง</b>: ฝั่งผู้ขายในลักษณะเดียวกัน</li></ul><p>ดู volume ประกอบ: value ย้ายขึ้นพร้อม volume ที่เพิ่ม แปลว่ามีแรงสนับสนุน ถ้า value ย้ายแต่ volume ลดลง ระวังการย้ายที่ไม่มีคนตาม</p><p class="tip">นี่คือคำถามข้อที่สองของ Dalton: ตลาด "ทำได้ดีไหม" ในทิศที่พยายามไป (ข้อแรกคือพยายามไปทางไหน)</p>`,
   demo:{kind:'normalVar',seed:816,d:1,show:{...hide,prior:true,va:true,vp:true},capFn:(S,P)=>`วันนี้: ${VAPN[vaPlace(P,S.prior)]} (VA วันนี้ ${P.val}–${P.vah} · เมื่อวาน ${S.prior.val}–${S.prior.vah})`}},
  {h:'Bracket กับ Trend',b:`<p><b>Trend</b>: value ย้ายไปทางเดียวต่อเนื่อง VA วันต่อวันแทบไม่ซ้อนกัน · <b>Bracket</b>: value ซ้อนทับกันอยู่ระหว่างขอบบนและล่างที่ชัด ตลาดหมุนไปมา</p><ul><li>ในเทรนด์: เทรดตามทิศ แล้วให้ตลาดทำงาน</li><li>ใน bracket: ผู้ซื้อและผู้ขายระยะยาวกลายเป็นฝ่าย responsive ที่ขอบ ซื้อใกล้ขอบล่าง ขายใกล้ขอบบน และทำกำไรเร็ว</li><li>ตลาดมักทดสอบขอบ bracket มากกว่าหนึ่งครั้ง ดูว่าที่ขอบเกิด acceptance หรือ rejection</li><li>เทรนด์มักจบด้วยการเข้าสู่ bracket และ bracket จบเมื่อราคาออกนอกขอบแล้วถูกยอมรับ</li></ul><p class="tip">ตลาดใช้เวลาส่วนใหญ่อยู่ในโหมด bracket มากกว่าเทรนด์ จึงต้องรู้ก่อนเสมอว่าตอนนี้อยู่โหมดไหน</p>`,
   demo:{html:()=>{if(!HAS_REAL)return'';const n=Math.min(14,REAL.sessions.length);const v=vaBoxes(REAL.sessions.length-n,n);return v.html+`<p class="demo-cap">ทองจริง ${n} วันล่าสุดในเกม: กล่องทอง = value area แต่ละวัน · ขีด = POC · เส้นจาง = high–low</p>`}}},
 ],
 drill:s=>{const R=mulberry32(s);const qs=[];
  // TPO count on a small text profile
  {const mp=miniProfile(R);const t=mp.count,opts=[`${t.up}/${t.dn}`,`${t.up+t.tail}/${t.dn}`,`${t.dn}/${t.up}`,`${t.up}/${t.dn+mp.botTail}`];
   const uniq=[...new Set(opts)];const lean=t.dn>t.up?'ผู้ซื้อได้เปรียบ (เวลาสะสมใต้ POC โดยราคาไม่ขยายลง)':t.up>t.dn?'ผู้ขายได้เปรียบ (เวลาสะสมเหนือ POC โดยราคาไม่ขยายขึ้น)':'สมดุล';
   qs.push(mcq('TPO count ของโปรไฟล์นี้คือเท่าไร (เหนือ POC / ใต้ POC) จำไว้ว่าไม่นับ single-print tail ที่ปลาย',uniq,0,`POC อยู่ที่ ${mp.poc} · เหนือ ${t.up} / ใต้ ${t.dn} → ${lean}`,{html:`<div class="key">${mp.text}</div>`}))}
  {let S,t;for(let k=0;k<10;k++){S=makeSession(pick(R,['normal','normalVar','neutral']),s+11+k*7);t=tpoCount(prof(S));if(Math.abs(t.up-t.dn)>=Math.max(4,(t.up+t.dn)*.15))break}
   const a=t.dn>t.up?0:1;qs.push(mcq('ดู TPO ของวันนี้ ใครได้เปรียบภายใน value area?',['ผู้ซื้อ: TPO ใต้ POC มากกว่า','ผู้ขาย: TPO เหนือ POC มากกว่า'],a,`TPO count: เหนือ POC ${t.up} / ใต้ POC ${t.dn} (ไม่นับ tail)`,{sess:S,n:NB,show:{...hide,tpo:true},revealMarks:[{p:tpoPocOf(prof(S)),label:'TPO POC'}],reveal:true}))}
  // Rotation factor from a table
  {const S=makeSession(pick(R,['normalVar','trend','neutral']),s+31);const H=periodsHL(S,6),rf=rotFactor(H);
   qs.push({type:'num',q:`คำนวณ Rotation Factor ของ 6 ช่วงแรก (A–F)<div class="key">${H.map((h,i)=>`${LET[i]}  high ${f1(h.h)}  low ${f1(h.l)}`).join('\n')}</div>`,a:rf,tol:0,unit:'',ex:H.slice(1).map((h,i)=>`${LET[i+1]}: high ${fsgn(Math.sign(h.h-H[i].h))} low ${fsgn(Math.sign(h.l-H[i].l))}`).join(' · ')+` → รวม <b>${fsgn(rf)}</b>`})}
  {let S,rf,lab;for(let k=0;k<12;k++){const kd=pick(R,['trend','trend','normal','OA']);S=makeSession(kd,s+41+k*5,{d:R()<.5?1:-1});rf=rotFactor(periodsHL(S,8));lab=rf>=4?0:rf<=-4?1:Math.abs(rf)<=1?2:-1;if(lab>=0)break}
   if(lab<0)lab=rf>0?0:1;qs.push(mcq('จาก 8 ช่วงแรก Rotation Factor บอกว่าตลาดพยายามไปทางไหน?',['ขึ้น (RF บวกชัด)','ลง (RF ลบชัด)','หมุนสองทาง (RF ใกล้ 0)'],lab,`RF ของ 8 ช่วงแรก = <b>${fsgn(rf)}</b> แต่อย่าลืม RF บอกแค่ "พยายาม" ต้องดูว่าตลาดทำได้ดีไหมด้วย`,{sess:S,n:48,show:{...hide,tpo:true}}))}
  // Initiative vs responsive
  const IR=['Initiative buying','Initiative selling','Responsive buying','Responsive selling'];
  for(const sc of shuffle([['gapGo',1],['gapGo',-1],['vaFade',1],['vaFade',-1]]).slice(0,3)){const[kd,d]=sc;const S=makeSession(kd,s+60+d*3+(kd==='vaFade'?9:0),{d});
   const a=kd==='gapGo'?(d>0?0:1):(d>0?3:2);const qtxt=kd==='gapGo'?`ราคาเปิด${d>0?'เหนือ':'ใต้'}กรอบเมื่อวานแล้ว${d>0?'ถูกซื้อดันขึ้น':'ถูกขายกดลง'}ต่อ การซื้อขายแบบนี้คืออะไร?`:`${d>0?'ราคาขึ้นไปเหนือ pVAH':'ราคาลงไปใต้ pVAL'} แล้วถูก${d>0?'ขาย':'ซื้อ'}กลับเข้ามา แรงที่ตีกลับนี้คืออะไร?`;

  {h:'Non-Trend Day: วันที่ไม่มีใครลงมือ',b:`<p>กรอบทั้งวันแคบมาก IB แคบ และ<b>แทบไม่มี range extension</b> volume ต่ำ ตัวอักษรซ้อนกันเป็นก้อนเตี้ยๆ</p><ul><li>ทั้ง day timeframe และ OTF ไม่มีใครยอมลงมือ มักเกิดก่อนข่าวใหญ่ วันหยุด หรือช่วงที่ตลาดรอข้อมูล</li><li>ต่างจาก Normal Day: Normal มี IB กว้างเพราะ OTF เข้ามาแรงช่วงต้นแล้วหยุด ส่วน Non-Trend แทบไม่มีใครเข้ามาเลย</li><li>ไม่ใช่ balance ที่แข็งแรง แต่เป็น<b>การไม่มีข้อมูลใหม่</b> กรอบนี้จึงมักถูกทะลุแรงเมื่อข่าวหรือผู้เล่นกลับมา</li></ul><div class="key wrap">แผน: ลดขนาดหรือไม่เทรด อย่าคาดหวังกำไรจากการ fade ขอบ เพราะระยะสั้นเกินคุ้มค่าความเสี่ยง

  {h:'Neutral-Center กับ Neutral-Extreme',b:`<p>Neutral Day ขยายกรอบออกนอก IB <b>ทั้งสองฝั่ง</b> สิ่งที่บอกความหมายคือ<b>ราคาปิด</b></p><ul><li><b>Neutral-Center</b>: ปิดกลางกรอบ ผู้ซื้อและผู้ขายสูสี วันถัดไปมักหมุนอยู่ในกรอบเดิม (balance)</li><li><b>Neutral-Extreme</b>: ปิดที่ปลายข้างหนึ่ง มักเป็นฝั่งที่ขยายทีหลัง ฝั่งนั้นชนะช่วงท้าย และการทะลุครั้งที่สองเกิดหลังจากอีกฝั่งถูกปฏิเสธไปแล้ว จึงมีน้ำหนักกว่า</li></ul><div class="key wrap">Neutral-Extreme ที่ปิดนอก value area เมื่อวาน = สัญญาณต่อเนื่องที่แรงขึ้น

  {h:'รูป P และ b: Short covering กับ Long liquidation',b:`<p>โปรไฟล์ที่มีส่วน<b>ผอมยาว</b>ด้านหนึ่งและ value ก้อนใหญ่อีกด้าน</p><ul><li><b>รูป P</b>: ขึ้นแรงช่วงต้นแล้วสร้าง value ด้านบน มักเกิดจาก <b>short covering</b> คือคนที่ short อยู่รีบซื้อคืน ไม่ใช่ผู้ซื้อรายใหม่ที่ตั้งใจถือยาว</li><li><b>รูป b</b>: ลงแรงช่วงต้นแล้วสร้าง value ด้านล่าง มักเป็น <b>long liquidation</b> คือคนที่ถือ long อยู่ทยอยขายออก</li></ul><p>สัญญาณที่บอกว่าเป็นแค่การปิดสถานะ: เกิดหลังเคลื่อนไหวสวนทางมาหลายวัน, ส่วนที่ผอมวิ่งเร็วแต่ volume ไม่ต่อเนื่อง และเมื่อแรงปิดสถานะหมด ไม่มีใครดันต่อ</p><div class="key wrap">แผน: อย่าไล่ซื้อปลายรูป P (หรือไล่ขายปลายรูป b)

  {h:'Spike: การวิ่งช่วงท้ายวัน',b:`<p><b>Spike</b> คือการวิ่งออกนอกกรอบใน 1–2 ช่วงสุดท้ายของวัน ตลาดยังไม่มีเวลายืนยันว่าราคาใหม่ถูกยอมรับ จุดที่เริ่มวิ่งเรียกว่า<b>ฐานของ spike</b></p><div class="key wrap">กติกาวันถัดไป (เทียบราคาเปิดกับ spike ขาขึ้น)

  {h:'Gap: เปิดนอกกรอบทั้งหมด',b:`<p>Gap ในความหมายนี้คือเปิด<b>นอก range ทั้งหมดของเมื่อวาน</b> ไม่ใช่แค่นอก value area เป็นการกระทำแบบ initiative ที่แรงที่สุดแบบหนึ่ง</p><ul><li><b>Breakaway</b>: ออกจาก bracket ที่ยาวนาน เริ่มเทรนด์ใหม่ มักไม่กลับมาปิด gap</li><li><b>Continuation</b>: เกิดกลางเทรนด์ ยืนยันทิศเดิม</li><li><b>Exhaustion</b>: เกิดหลังเทรนด์วิ่งมานาน ถูกปิด gap เร็ว แล้วมักตามด้วยการกลับตัว</li></ul><div class="key wrap">กฎใช้จริง: gap ที่แข็งแรงไม่ควรถูกเติมจนเต็มในช่วง IB

  // minus development
  {let S,z;for(let t=0;t<15&&!z;t++){S=makeSession(pick(R,['double','pShape','trend']),s+131+t*11,{d:R()<.5?1:-1});const Z=thinZones(prof(S));z=Z.length?Z.reduce((a,b)=>b.b-b.a>a.b-a.a?b:a):null}
   if(z)qs.push(clickQ('คลิกที่ <b>minus development</b>: ส่วนกลางโปรไฟล์ที่มีตัวอักษรแค่ 1–2 ตัวติดกันหลายแถว',S,{zone:[z.a,z.b]},{show:{...hide,tpo:true},lenient:true,ex:`ช่วง <b>${z.a}–${z.b}</b> ราคาวิ่งผ่านเร็วจนไม่ได้สร้างการซื้อขายสองทาง เป็นระดับที่ยังค้าง แต่ในทองจริงไม่ได้ถูกเติมวันถัดไปบ่อยกว่าแถบราคาทั่วไป`}))}

{id:'avwap',after:'adv',title:'Anchored VWAP',en:'AVWAP · anchors · pinch · handoff',blurb:'ต้นทุนเฉลี่ยตั้งแต่เหตุการณ์สำคัญ ใครคุมตั้งแต่ตรงนั้น และจุดเข้าที่ความเสี่ยงต่ำ',
 lessons:[
  {h:'AVWAP คืออะไร',b:`<p><b>Anchored VWAP</b> คือ VWAP ที่เราเลือกเองว่าจะเริ่มนับจากแท่งไหน ค่าที่ได้คือ <b>ต้นทุนเฉลี่ยของทุกคนที่ซื้อขายตั้งแต่เหตุการณ์นั้น</b></p><div class="key">AVWAP = Σ(TP × Volume) ÷ ΣVolume   นับตั้งแต่แท่ง anchor ถึงแท่งปัจจุบัน
session VWAP ก็คือ AVWAP ที่ anchor ไว้ตอนเปิด session นั่นเอง</div><ul><li>ราคาอยู่เหนือ AVWAP = คนที่เข้ามาตั้งแต่ anchor โดยเฉลี่ยกำไร</li><li>ราคาอยู่ใต้ = โดยเฉลี่ยขาดทุน เมื่อราคากลับขึ้นมาที่ต้นทุน คนกลุ่มนี้มักขายเพื่อออกเท่าทุน</li></ul><p>เพราะคนจำราคาที่ตัวเองเข้า AVWAP จึงมักเป็นแนวรับ/ต้านแบบเคลื่อนที่</p><p class="tip">เนื้อหาด่านนี้เรียบเรียงจากแนวคิดในหนังสือ Anchored VWAP ของ Brian Shannon ปรับมาใช้กับกราฟในเกม</p>`,
   demo:{make:()=>{if(!HAS_REAL)return null;for(let k=REAL.sessions.length-1;k>1;k--){const S=realSession(k),sp=volSpike(S,4,S.nb-4);if(sp.ratio>=2.5)return{S,n:S.nb,sp}}return null},show:{...hide,vwap:true},
     avwaps:(S,P,m)=>[{i0:m.sp.i,label:'AVWAP '+S.times[m.sp.i],col:'#7ee0c3'}],capFn:(S,P,m)=>`ทองจริง ${S.date}: เส้นเขียว = AVWAP เริ่มที่แท่ง ${S.times[m.sp.i]} (volume ${m.sp.ratio.toFixed(1)} เท่าของปกติ) · เส้นฟ้า = session VWAP`}},
  {h:'จะ anchor ที่ไหน',b:`<p>อย่า anchor แบบสุ่ม ให้เริ่มจาก <b>เหตุการณ์ที่วัดได้</b> ซึ่งเปลี่ยนสมดุลของอุปสงค์และอุปทาน:</p><ul><li><b>แท่ง volume สูงผิดปกติ</b> (คร่าวๆ ตั้งแต่ 1.5 เท่าของปกติ) มักมาจากข่าวหรือ breakout คนจำนวนมากมีราคาที่ผูกพันอยู่ตรงนั้น</li><li><b>เหตุการณ์ข่าว</b> เช่น ตัวเลขเศรษฐกิจ การประชุมธนาคารกลาง</li><li><b>เหตุการณ์ด้านราคา</b> เช่น high/low สำคัญ gap การทะลุกรอบ</li><li><b>เหตุการณ์ด้านเวลา</b> เช่น เปิด session เปิดสัปดาห์ เปิดเดือน</li></ul><p class="tip">ระวัง: เรารู้ว่า low หนึ่ง "สำคัญ" ก็ต่อเมื่อราคาวิ่งออกจากมันไปแล้ว การ anchor ที่ low ของวันด้วยการมองย้อนหลังจะทำให้เส้นดูดีเกินจริง</p>`,
   demo:{kind:'trend',seed:902,d:1,show:{...hide,vwap:true},avwaps:(S)=>{const sp=volSpike(S,14,60);return[{i0:sp.i,label:'AVWAP แท่ง volume สูง',col:'#ffb86b'}]},cap:'เส้นฟ้า = anchor ที่เปิด session · เส้นส้ม = anchor ที่แท่ง volume สูงสุดหลังชั่วโมงแรก'}},
  {h:'ความชันบอกว่าใครคุม',b:`<p><b>ทิศและความชัน</b>ของ AVWAP สำคัญกว่าแค่ว่าราคาอยู่เหนือหรือใต้เส้น</p><ul><li>AVWAP ชันขึ้น = ผู้ซื้อคุมตั้งแต่จุด anchor ยิ่งชัน การย่อลงมาแตะยิ่งมักเป็นแนวรับ</li><li>ชันลง = ผู้ขายคุม เส้นมักเป็นแนวต้าน</li><li>แบน = ตลาดยอมรับราคาแถวนั้นแล้ว ถ้าถูกทดสอบบ่อยจะพลิกจากแนวรับเป็นแนวต้าน (หรือกลับกัน) ได้ง่าย</li></ul><p class="tip">ช่วงแรกหลัง anchor เส้นจะแกว่งแรงเพราะมีข้อมูลน้อย ยิ่งนานเส้นยิ่งนิ่ง ตรงกับที่เราทดสอบทองจริงว่า AVWAP ที่เพิ่งเริ่มตอนนิวยอร์กเปิดใช้เป็นแนวได้ไม่ดีเท่า VWAP ของทั้งวัน</p>`,

  {h:'จุดเข้า: แตะเส้น vs รอให้เด้ง',b:`<p>เมื่อราคาย่อกลับมาที่ AVWAP มีสองทาง:</p><ul><li><b>เข้าตอนแตะ</b>: ได้ราคาดีถ้าเส้นรับไว้ได้ แต่ไม่มีอะไรยืนยัน และหาจุด stop ตามโครงสร้างได้ยาก</li><li><b>รอให้เด้งออกจากเส้นก่อน</b> (คร่าวๆ 3–5 แท่ง) แล้วเข้าตาม momentum วาง stop ใต้ higher-low ที่เพิ่งเกิด: ได้ราคาแย่ลงนิดหน่อย แต่มีหลักฐานว่าฝั่งเราป้องกันเส้นได้จริง และความเสี่ยงชัดเจน</li></ul><div class="key">AVWAP เป็น "โซน" ไม่ใช่ราคาเป๊ะ

/* ============ Mind Over Markets toolkit helpers ============ */
const fsgn=x=>(x>0?'+':'')+x;
function avwapArr(S,i0,n){const out=new Array(n).fill(null);let pv=0,v=0;for(let i=i0;i<n&&i<S.nb;i++){const b=S.bars[i];pv+=(b.h+b.l+b.c)/3*b.v;v+=b.v;out[i]=pv/v}return out}
function volSpike(S,a,b){const vs=S.bars.slice(a,b).map(x=>x.v).sort((p,q)=>p-q),med=vs[vs.length>>1]||1;let bi=a,br=0;for(let i=a;i<b;i++){const r=S.bars[i].v/med;if(r>br){br=r;bi=i}}return{i:bi,ratio:br,med}}
function swingHigh(S,a,b){let bi=a;for(let i=a;i<=b;i++)if(S.bars[i].h>S.bars[bi].h)bi=i;return bi}
function swingLow(S,a,b){let bi=a;for(let i=a;i<=b;i++)if(S.bars[i].l<S.bars[bi].l)bi=i;return bi}
// TPO POC: longest row, ties go to the row closest to the middle of the range
function tpoPocOf(P){let bi=0;const mid=(P.len-1)/2;P.tp.forEach((t,j)=>{const b=P.tp[bi].length;if(t.length>b||(t.length===b&&Math.abs(j-mid)<Math.abs(bi-mid)))bi=j});return P.base+bi}
// TPOs above / below the TPO POC, single-print tails (2+ rows at an extreme) excluded
function tpoCount(P){let top=null,bot=null;for(const s of P.singles){if(s.top&&s.b-s.a>=1)top=s;if(s.bot&&s.b-s.a>=1)bot=s}
  const poc=tpoPocOf(P);let up=0,dn=0;P.tp.forEach((t,j)=>{const r=P.base+j;if(top&&r>=top.a)return;if(bot&&r<=bot.b)return;if(r>poc)up+=t.length;else if(r<poc)dn+=t.length});return{up,dn,poc}}
function periodsHL(S,np){const out=[];for(let p=0;p<np;p++){let h=-1e9,l=1e9;for(let i=p*S.per;i<Math.min(S.nb,(p+1)*S.per);i++){h=Math.max(h,S.bars[i].h);l=Math.min(l,S.bars[i].l)}if(h>-1e9)out.push({h:r1(h),l:r1(l)})}return out}
function rotFactor(H){let s=0;for(let k=1;k<H.length;k++)s+=Math.sign(H[k].h-H[k-1].h)+Math.sign(H[k].l-H[k-1].l);return s}
// ledge: biggest jump in TPO count between adjacent rows away from the extremes; r = the edge row of the wider part
function findLedge(P){const T=P.tp;let best=null;for(let j=2;j<T.length-3;j++){const d=T[j].length-T[j+1].length;if(Math.abs(d)>=3&&(!best||Math.abs(d)>best.d))best={r:d>0?P.base+j:P.base+j+1,d:Math.abs(d)}}return best}
// a small hand-sized TPO profile for the counting exercise
function miniProfile(R){const L='ABCDEFGH',rows=10+Math.floor(R()*3),base=100+Math.floor(R()*50);let cnt=[];
  for(let j=0;j<rows;j++){const x=(j-(rows-1)/2+(R()-.5)*1.5)/(rows/2.6);cnt.push(Math.max(1,Math.round(7*Math.exp(-x*x)+(R()-.5)*1.2)))}
  const tTop=R()<.6,tBot=R()<.6;if(tTop){cnt[rows-1]=1;cnt[rows-2]=1}if(tBot){cnt[0]=1;cnt[1]=1}
  const tp=cnt.map(c=>{const s=new Set();while(s.size<Math.min(c,8))s.add(Math.floor(R()*8));return[...s].sort((a,b)=>a-b)});
  const P={tp,base,len:rows,singles:[]};let st=-1;for(let j=0;j<=rows;j++){const one=j<rows&&tp[j].length===1;if(one&&st<0)st=j;if(!one&&st>=0){P.singles.push({a:base+st,b:base+j-1,bot:st===0,top:j-1===rows-1});st=-1}}
  const c=tpoCount(P);const topT=P.singles.find(x=>x.top&&x.b-x.a>=1),botT=P.singles.find(x=>x.bot&&x.b-x.a>=1);
  const text=tp.map((t,j)=>`${base+j}  ${t.map(q=>L[q]).join(' ')}`).reverse().join('\n');
  return{text,count:c,poc:c.poc,tail:topT?topT.b-topT.a+1:0,botTail:botT?botT.b-botT.a+1:0}}

const VAPN={higher:'สูงขึ้น (ไม่ซ้อนกัน)',ovHigher:'ซ้อนทับ-สูงขึ้น',overlap:'ซ้อนทับ / ไม่เปลี่ยน',ovLower:'ซ้อนทับ-ต่ำลง',lower:'ต่ำลง (ไม่ซ้อนกัน)'};
const VAPX={higher:'ผู้ซื้อชนะชัด ตลาดยอมรับราคาที่สูงขึ้นทั้งก้อน',ovHigher:'เอียงไปทางผู้ซื้อแต่ยังไม่เด็ดขาด',overlap:'balance ตลาดยังยอมรับ value เดิม',ovLower:'เอียงไปทางผู้ขายแต่ยังไม่เด็ดขาด',lower:'ผู้ขายชนะชัด ตลาดยอมรับราคาที่ต่ำลงทั้งก้อน'};
function vaPlace(P,p){if(P.val>p.vah)return'higher';if(P.vah<p.val)return'lower';const sh=(P.val+P.vah)/2-(p.val+p.vah)/2,w=Math.max(1,p.vah-p.val);return sh>.25*w?'ovHigher':sh<-.25*w?'ovLower':'overlap'}
// daily value areas of real sessions drawn as boxes, plus a bracket/trend label (null when unclear)
// several real days merged into 1h bars: one letter per day, profile = composite
function compositeSess(st,n){const g=Math.max(1,Math.round(60/REAL.int)),bars=[];let per=0;
  for(let k=st;k<st+n&&k<REAL.sessions.length;k++){const s=REAL.sessions[k];let c=0;for(let i=0;i<s.o.length;i+=g,c++){const j=Math.min(s.o.length,i+g);
    bars.push({o:s.o[i],h:Math.max(...s.h.slice(i,j)),l:Math.min(...s.l.slice(i,j)),c:s.c[j-1],v:s.v.slice(i,j).reduce((a,b)=>a+b,0)})}per=per||c}
  const P=profileOf(bars,bars.length,per,1),prior={vah:P.vah,val:P.val,poc:P.poc,hi:P.hi,lo:P.lo,close:bars[bars.length-1].c};
  return buildSess(bars,prior,{kind:'composite',d:1,U:10,per,ibn:1,mins:60,src:'gc',days:Math.min(n,REAL.sessions.length-st),d0:REAL.sessions[st].d})}
function realShape(k){const S=realSession(k),P=prof(S),pos=(P.poc-P.lo)/(P.hi-P.lo);return{S,pos,sh:pos>=.68?'P':pos<=.32?'b':pos>=.42&&pos<=.58?'D':null}}
function is3I(S){const P=prof(S),p=S.prior,c=vaPlace(P,p),cl=S.bars[S.nb-1].c,up=P.hi-P.ibh,dn=P.ibl-P.lo;
  if(c==='higher'&&up>dn&&cl>p.vah)return 1;if(c==='lower'&&dn>up&&cl<p.val)return-1;return 0}
function spikeBase(S){const a=S.q||66;let m=S.d>0?-1e9:1e9;for(let i=0;i<a;i++)m=S.d>0?Math.max(m,S.bars[i].h):Math.min(m,S.bars[i].l);
  let e=m;for(let i=a;i<S.nb;i++)e=S.d>0?Math.max(e,S.bars[i].h):Math.min(e,S.bars[i].l);return{base:r1(m),end:r1(e)}}
// interior runs of thin rows (<=2 TPOs): price moved through too fast to build structure
function thinZones(P){const T=P.tp,out=[],min=Math.max(3,.06*(P.hi-P.lo));for(let j=2;j<T.length-2;j++){if(T[j].length>2)continue;let e=j;while(e+1<T.length-2&&T[e+1].length<=2)e++;if(e-j+1>=min)out.push({a:P.base+j,b:P.base+e});j=e}return out}
function realDayStats(k){const s=REAL.sessions[k],b=s.o.map((o,i)=>({o,h:s.h[i],l:s.l[i],c:s.c[i],v:s.v[i]})),per=Math.max(1,30/REAL.int);return{d:s.d,P:profileOf(b,b.length,per,per*2),vol:s.v.reduce((a,x)=>a+x,0)}}
function volTable(n){const N=REAL.sessions.length,rows=[];for(let k=Math.max(6,N-n);k<N;k++){const t=realDayStats(k),y=realDayStats(k-1);let av=0;for(let q=k-5;q<k;q++)av+=realDayStats(q).vol;av/=5;
    const pl=vaPlace(t.P,y.P),r=t.vol/av,mv=pl!=='overlap',hiV=r>=1.1,loV=r<=.9;
    rows.push(`<tr><td>${t.d.slice(5)}</td><td>${VAPN[pl]}</td><td style="text-align:right">${Math.round(r*100)}%</td><td>${mv?(hiV?'ย้ายพร้อมคนตาม':loV?'ย้ายแต่คนน้อย ระวัง':'ย้าย volume ปกติ'):(hiV?'สู้กันหนักในกรอบ':loV?'เงียบ รอข้อมูล':'balance')}</td></tr>`)}
  return`<div class="tblwrap"><table class="vt"><thead><tr><th>วันที่</th><th>value เทียบเมื่อวาน</th><th>volume / เฉลี่ย 5 วัน</th><th>อ่านว่า</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>`}
function vaBoxes(st,n){const D=[];for(let k=st;k<st+n&&k<REAL.sessions.length;k++){const s=REAL.sessions[k],b=s.o.map((o,i)=>({o,h:s.h[i],l:s.l[i],c:s.c[i],v:s.v[i]})),per=Math.max(1,30/REAL.int),P=profileOf(b,b.length,per,per*2);D.push({val:P.val,vah:P.vah,poc:P.poc,hi:P.hi,lo:P.lo})}
  const lo=Math.min(...D.map(d=>d.lo)),hi=Math.max(...D.map(d=>d.hi)),W=600,H=220,pad=14,cw=(W-2*pad)/D.length,Y=p=>pad+(hi-p)/(hi-lo)*(H-2*pad);
  const mids=D.map(d=>(d.val+d.vah)/2),w=D.reduce((a,d)=>a+(d.vah-d.val),0)/D.length,net=mids[mids.length-1]-mids[0];let agree=0;for(let i=1;i<mids.length;i++)if(Math.sign(mids[i]-mids[i-1])===Math.sign(net))agree++;
  const label=Math.abs(net)>=2.5*w&&agree>=mids.length-2?'trend':Math.max(...mids)-Math.min(...mids)<=2*w&&Math.abs(net)<=w?'bracket':null;
  const g=D.map((d,i)=>{const x=pad+i*cw+cw*.2,bw=cw*.6,cx=pad+i*cw+cw/2;return`<line x1="${cx}" x2="${cx}" y1="${Y(d.hi)}" y2="${Y(d.lo)}" stroke="#8e9bac" stroke-opacity=".45"/><rect x="${x}" y="${Y(d.vah)}" width="${bw}" height="${Math.max(2,Y(d.val)-Y(d.vah))}" fill="#e6ae4f" fill-opacity=".32" stroke="#e6ae4f"/><line x1="${x}" x2="${x+bw}" y1="${Y(d.poc)}" y2="${Y(d.poc)}" stroke="#e6ae4f" stroke-width="2"/>`}).join('');
  const html=`<div class="chart" style="padding:6px"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="value area รายวัน" style="display:block">${g}<text x="${W-pad}" y="${pad+2}" fill="#8e9bac" font-size="11" text-anchor="end" font-family="IBM Plex Mono,monospace">${f1(hi)}</text><text x="${W-pad}" y="${H-4}" fill="#8e9bac" font-size="11" text-anchor="end" font-family="IBM Plex Mono,monospace">${f1(lo)}</text></svg></div>`;
  return{html,label}}
// overnight inventory of a real session vs the prior COMEX settle (last bar before 13:30 New York)
function onInventory(idx){if(!HAS_REAL||idx<1)return null;const pr=REAL.sessions[idx-1];let fET;try{fET=new Intl.DateTimeFormat('en-GB',{timeZone:'America/New_York',hour:'2-digit',minute:'2-digit',hour12:false})}catch(e){return null}
  const et=t=>{const[h,m]=fET.format(new Date(t*1000)).split(':').map(Number);return(h%24)*60+m};let settle=null;
  for(let i=0;i<pr.o.length;i++){const m=et(pr.t0+i*REAL.int*60);if(m>=500-REAL.int&&m<810)settle=pr.c[i]}
  const S=realSession(idx),nyS=S.sess?S.sess.start.ny:-1;if(settle==null||nyS<4)return null;
  let ab=0;for(let i=0;i<nyS;i++)if(S.bars[i].c>settle)ab++;const frac=ab/nyS,inv=frac>=.65?'long':frac<=.35?'short':'neutral';
  const k=Math.min(S.nb-1,nyS+Math.round(60/S.mins)-1);return{S,settle,nyS,frac,inv,o:S.bars[nyS].o,c1:S.bars[k].c,k}}
function scenarioQ(k,S){
  const up=S.d>0,L=up?'Long':'Short',O=up?'Short':'Long';let q,opts,ex,show={...hide,prior:true,tpo:true};
  switch(k){
   case'eighty':q=`ราคาเปิด${up?'ใต้':'เหนือ'} Value Area ของเมื่อวาน (เส้นประสีทอง) แล้วกลับเข้ามาอยู่ใน VA ได้ครบ 2 ช่วง TPO (C และ D) แผนไหนสอดคล้องกับ 80% rule ที่สุด?`;
    opts=[`${L} ตอนนี้ เป้า ${up?'pVAH':'pVAL'} · stop ${up?'ใต้ pVAL':'เหนือ pVAH'} (ถ้าราคาหลุดกลับออกไป ไอเดียผิด)`,`${O} สวน เพราะราคาวิ่งกลับมาไกลแล้ว`,`${L} โดยไม่ตั้ง stop เพราะ “โอกาสชนะ 80%”`,'ไม่สนใจ value ของเมื่อวานไม่เกี่ยวกับวันนี้'];
    ex='การเปิดนอก value ถูกปฏิเสธ ตลาดกลับมายอมรับ value เดิม จึงมีโอกาสเดินทางข้าม VA ไปอีกฝั่ง';break;
   case'vaFade':q=`วันนี้เปิดใน Value Area ของเมื่อวาน ราคา${up?'ขึ้นทะลุ pVAH':'ลงหลุด pVAL'}เล็กน้อยแล้วถูก${up?'ขาย':'ซื้อ'}กลับเข้ามาใน VA อย่างรวดเร็ว แผนไหนดีที่สุด?`;
    opts=[`${O} กลับเข้า VA · stop ${up?'เหนือ high':'ใต้ low'} ที่ถูกปฏิเสธ · เป้า pPOC`,`${up?'Long':'Short'} เพราะราคาเพิ่ง breakout ${up?'pVAH':'pVAL'}`,`${O} แล้ววาง stop ห่างแค่ 0.2 จุด เพื่อให้เสียน้อย`,`${up?'Long':'Short'} เพิ่มเพื่อเฉลี่ยต้นทุน`];
    ex='ราคานอก value ไม่ได้รับการยอมรับ (ไม่มีเวลาและปริมาณ) ผู้ที่ไล่ breakout ติดอยู่ผิดฝั่ง POC คือเป้าธรรมชาติ';break;
   case'failBO':q=`วันนี้ IB กว้าง ราคาพยายาม${up?'ขึ้นทะลุ IB High':'ลงทะลุ IB Low'}ในช่วง D แต่ไปได้เล็กน้อยแล้วกลับเข้ากรอบ IB แผนไหนดีที่สุด?`;
    opts=[`${O} กลับเข้ากรอบ · stop ${up?'เหนือ high':'ใต้ low'} ที่ fail · เป้ากลาง IB`,`${up?'Long':'Short'} ตาม breakout ทันทีที่ราคากลับมาแตะ IB`,`รอจนราคาไปถึง ${up?'+2σ':'−2σ'} ก่อนค่อยทำอะไร`,`${O} แล้วเลื่อน stop ออกไปเรื่อยๆ ถ้าราคาสวน`];
    ex='Look above/below and fail: ไม่มีใครต้องการราคานอก IB ตลาดจึงกลับไปหมุนในกรอบ';show={...hide,tpo:true,ib:true};break;
   case'trendPull':q=`วันนี้เปิดแบบ Open Drive ${up?'ขาขึ้น':'ขาลง'} ราคาอยู่${up?'เหนือ':'ใต้'} VWAP มาตลอด ตอนนี้ย่อกลับมาแตะ VWAP แล้วเริ่ม${up?'เด้งขึ้น':'ถูกขายลง'} แผนไหนดีที่สุด?`;
    opts=[`${L} ตามเทรนด์ · stop ${up?'ใต้ swing low':'เหนือ swing high'} ล่าสุด / อีกฝั่งของ VWAP`,`${O} เพราะราคาเริ่มกลับตัวแล้ว`,`รอให้ทำ ${up?'high':'low'} ใหม่ก่อน แล้วค่อยไล่ราคา`,'ไม่เทรด เพราะวันเทรนด์คาดเดาไม่ได้'];
    ex='ในวันเทรนด์ VWAP คือที่ที่สถาบันเติมของ การย่อมาแตะคือจุดเข้าที่ความเสี่ยงต่ำและ stop ชัดเจน';show={...hide,vwap:true,bands:true};break;
   case'ddRetest':q=`ช่วงเช้าเป็น balance แล้วราคา${up?'วิ่งขึ้น':'ไหลลง'}เร็วจนทิ้ง single prints ไว้ (แถบไฮไลต์) ตอนบ่ายราคาย้อนกลับมาที่ขอบ single prints แผนไหนดีที่สุด?`;
    opts=[`${L} ใกล้ขอบ single prints · stop ${up?'ใต้':'เหนือ'}กลางโซน single prints`,`${O} เพราะเชื่อว่า single prints ต้องถูกเติมเต็มเสมอ`,`${L} โดยไม่มี stop`,'รอให้ราคากลับไปที่ POC ช่วงเช้าก่อน'];
    ex='Single prints คือร่องรอยของแรง OTF ถ้ายังมีคนปกป้อง ราคาจะเด้งจากขอบ และ stop ที่กลางโซนบอกได้ชัดว่าผิดเมื่อไร';show={...hide,tpo:true,singles:true,vp:true};break;
   case'gapGo':q=`ราคาเปิด gap ${up?'เหนือ high':'ใต้ low'} ของเมื่อวาน และ 30 นาทีแรก${up?'วิ่งขึ้น':'ไหลลง'}ต่อทันทีโดยไม่กลับมาที่ราคาเปิด แผนไหนดีที่สุด?`;
    opts=[`เทรดตามทิศ: ${L} ตอนย่อ · stop ${up?'ใต้':'เหนือ'}ราคาเปิด`,`${O} เพื่อเล่นให้ gap ปิด กลับไป ${up?'high':'low'} เมื่อวาน`,'รอราคากลับเข้า VA เมื่อวานก่อนค่อยคิด',`${O} เพราะราคาวิ่งเร็วเกินไป`];
    ex='เปิดนอกกรอบ + Open Drive = ความมั่นใจสูงสุด การเล่นให้ gap ปิดคือการสวน OTF';show={...hide,prior:true,vwap:true};break;
  }
  return mcq(q,opts,0,ex,{sess:S,n:S.q||24,show,reveal:true,rex:'ดูส่วนที่เหลือของวันบนกราฟ ในตลาดจริง setup นี้ไม่ได้สำเร็จทุกครั้ง นี่คือเหตุผลที่แผนต้องมี stop เสมอ'});
}

/* ============ letter reading trainer ============ */
// One 30-minute TPO period at a time: read what the last letter did, predict the next one, then see what happened and why.
let LT=null;
const IRN={ib:'Initiative buying',is:'Initiative selling',rb:'Responsive buying',rs:'Responsive selling'};
const PRN={up:'ขยายขึ้น (ทำ high ใหม่)',dn:'ขยายลง (ทำ low ใหม่)',in:'อยู่ในกรอบเดิม'};
function ltTime(S,k){const i=Math.min(S.nb-1,k*S.per);return S.times?S.times[i]:timeOf(i)}
// the New York part of a real session only (Dalton's "pit session"), referenced to yesterday's New York value
function nySession(idx){const F=realSession(idx);if(!F.sess||F.sess.start.ny<0)return null;const i0=F.sess.start.ny;
  return buildSess(F.bars.slice(i0),F.priorRTH||F.prior,{kind:'real',d:1,U:F.U,per:F.per,ibn:F.ibn,mins:F.mins,times:F.times.slice(i0),date:F.date,src:'gc',ny:true})}
